<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Premium Shop</title>
    <link rel="icon" type="image/jpeg" href="Dkart.jpg">
    <link rel="apple-touch-icon" href="Dkart.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #000000; --accent: #ffff00; --white: #ffffff; --bg: #0a0a0a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; color: var(--white); overflow-x: hidden; }

        header { background: var(--primary); padding: 15px 10px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 1000; }
        .logo-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; }
        .logo-img { width: 40px; height: 40px; border-radius: 5px; border: 1.5px solid var(--white); }
        .brand { font-family: 'Montserrat', sans-serif; font-size: 26px; font-weight: 900; color: var(--accent); font-style: italic; }
        .trust-text { font-size: 10px; color: var(--accent); text-align: center; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        
        .header-action-row { display: flex; align-items: center; gap: 10px; padding: 0 5px; }
        .search-box { flex: 1; background: #1a1a1a; border-radius: 8px; display: flex; align-items: center; padding: 10px 15px; border: 1px solid #333; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; font-size: 14px; }
        .help-btn { background: #25D366; color: white; width: 42px; height: 42px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; text-decoration: none; border: 1px solid white; }

        .cat-row { display: flex; overflow-x: auto; padding: 15px 10px; gap: 15px; scrollbar-width: none; background: #111; border-bottom: 1px solid #222; }
        .cat-row::-webkit-scrollbar { display: none; }
        .cat-item { min-width: 75px; text-align: center; cursor: pointer; transition: 0.3s; }
        .cat-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 20px; color: #000; border: 2px solid #fff; }
        .cat-item span { font-size: 10px; font-weight: 700; color: #fff; display: block; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .p-card { background: #151515; padding: 10px; border-radius: 12px; border: 1.5px solid var(--white); position: relative; }
        .p-card img { width: 100%; height: 140px; object-fit: contain; border-radius: 8px; background: #222; }
        .wish-icon { position: absolute; top: 15px; right: 15px; font-size: 18px; color: #444; z-index: 5; }
        .wish-icon.active { color: #ff4757; }
        .p-name { font-size: 12px; font-weight: 600; color: var(--accent); margin-top: 10px; height: 35px; overflow: hidden; text-transform: uppercase; }
        .p-price { font-size: 17px; font-weight: 800; color: var(--white); margin: 5px 0; }

        /* Full View Overlays */
        .full-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 3000; display: none; overflow-y: auto; }
        .view-header { padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #333; background: var(--primary); position: sticky; top: 0; z-index: 3001; }
        .view-header span { color: var(--accent); font-weight: 700; margin-left: 15px; text-transform: uppercase; }

        /* Bottom Nav Bar Fix */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--primary); display: flex; justify-content: space-around; padding: 10px 0; border-top: 2px solid var(--accent); z-index: 2500; }
        .nav-tab { text-align: center; color: #888; flex: 1; transition: 0.3s; cursor: pointer; }
        .nav-tab.active { color: var(--accent); }
        .nav-tab i { font-size: 20px; display: block; margin-bottom: 3px; }
        .nav-tab span { font-size: 10px; font-weight: 600; text-transform: uppercase; }

        /* Tracking Steps */
        .step-row { position: relative; padding-left: 45px; margin-bottom: 25px; }
        .step-line { position: absolute; left: 19px; top: 20px; bottom: -20px; width: 2px; background: #333; }
        .step-dot { position: absolute; left: 12px; top: 0; width: 16px; height: 16px; border-radius: 50%; background: #333; border: 3px solid var(--bg); }
        .step-active .step-dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .step-active .step-text { color: #fff; font-weight: 800; }
        .step-text { color: #555; font-size: 14px; }
        
        /* Order Cards */
        .order-card { background: #1a1a1a; margin: 10px; padding: 12px; border-radius: 10px; display: flex; gap: 15px; border-left: 4px solid var(--accent); align-items: center; }
        .order-img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; }

        .btn-box { position: fixed; bottom: 0; width: 100%; height: 60px; z-index: 3500; }
        .btn-main { width: 100%; height: 100%; border: none; font-weight: 900; background: var(--accent); color: #000; font-size: 16px; text-transform: uppercase; }
        .addr-input { width: 100%; padding: 15px; margin-bottom: 10px; background: #111; color: white; border: 1px solid #333; border-radius: 8px; }
    </style>
</head>
<body>

<div id="home-sec">
    <header>
        <div class="logo-row">
            <img src="Dkart.jpg" class="logo-img" onerror="this.src='https://via.placeholder.com/40'">
            <span class="brand">DKART</span>
        </div>
        <div class="trust-text"><i class="fa-solid fa-shield-check"></i> 100% Trusted • Fast Delivery</div>
        
        <div class="header-action-row">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--accent)"></i>
                <input type="text" id="searchInput" placeholder="Search products..." onkeyup="searchFun()">
            </div>
            <a href="https://wa.me/918521694137?text=Hello%20Dkart%20Help%20Needed" target="_blank" class="help-btn">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
        </div>
    </header>

    <div class="cat-row">
        <div class="cat-item" onclick="filterCat('All')"><div class="cat-icon" style="background: #FFD700;"><i class="fa-solid fa-border-all"></i></div><span>All</span></div>
        <div class="cat-item" onclick="filterCat('Men')"><div class="cat-icon" style="background: #1E90FF;"><i class="fa-solid fa-person"></i></div><span>Men</span></div>
        <div class="cat-item" onclick="filterCat('Women')"><div class="cat-icon" style="background: #FF4757;"><i class="fa-solid fa-person-dress"></i></div><span>Women</span></div>
        <div class="cat-item" onclick="filterCat('Electronics')"><div class="cat-icon" style="background: #54a0ff;"><i class="fa-solid fa-plug"></i></div><span>Electronics</span></div>
    </div>

    <div class="grid" id="productList"></div>
</div>

<!-- Details View -->
<div id="detail-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="closeAll()"></i><span>Details</span></div>
    <div style="padding: 20px; text-align: center; padding-bottom: 100px;">
        <img id="det-img" style="width: 100%; border-radius: 12px; border: 1px solid #333;">
        <h2 id="det-name" style="color: var(--accent); margin-top: 15px;"></h2>
        <div id="det-price" style="font-size: 26px; font-weight: 800;"></div>
        <p id="det-desc" style="text-align:left; color:#ccc; font-size:13px; margin-top:20px; line-height:1.6;"></p>
    </div>
    <div class="btn-box"><button class="btn-main" onclick="openCheckout()">Buy Now</button></div>
</div>

<!-- Checkout View -->
<div id="checkout-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="closeCheckout()"></i><span>Checkout</span></div>
    <div style="padding: 20px; padding-bottom: 100px;">
        <input type="text" id="c-name" class="addr-input" placeholder="Full Name">
        <input type="tel" id="c-phone" class="addr-input" placeholder="Mobile Number">
        <input type="text" id="c-addr1" class="addr-input" placeholder="Full Address (House, Road, Area)">
        <input type="number" id="c-pin" class="addr-input" placeholder="Pincode">
    </div>
    <div class="btn-box"><button class="btn-main" id="order-btn">Confirm Order</button></div>
</div>

<!-- Orders View -->
<div id="orders-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="hideAllViews()"></i><span>My Orders</span></div>
    <div id="orderListContainer"></div>
</div>

<!-- Tracking View -->
<div id="tracking-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="document.getElementById('tracking-view').style.display='none'"></i><span>Track Order</span></div>
    <div id="trackingContent" style="padding: 25px;"></div>
</div>

<!-- Wishlist View -->
<div id="wishlist-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="hideAllViews()"></i><span>Wishlist</span></div>
    <div class="grid" id="wishlistGrid"></div>
</div>

<!-- Nav Bar -->
<nav class="nav-bar">
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="nav-tab" onclick="showOrders()"><i class="fa-solid fa-bag-shopping"></i><span>Orders</span></div>
    <div class="nav-tab" onclick="showWishlist()"><i class="fa-solid fa-heart"></i><span>Wishlist</span></div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allP = [], currentP = null;

    async function load() {
        const q = query(collection(db, "products"), orderBy("time", "desc"));
        const snap = await getDocs(q);
        allP = snap.docs.map(d => ({id: d.id, ...d.data()}));
        render(allP, 'productList');
    }

    function render(data, target) {
        const list = document.getElementById(target);
        list.innerHTML = "";
        data.forEach(p => {
            const card = document.createElement('div');
            card.className = 'p-card';
            card.innerHTML = `
                <i class="fa-solid fa-heart wish-icon ${isWished(p.id)?'active':''}" onclick="toggleWish(event, '${p.id}')"></i>
                <img src="${p.images[0] || 'Dkart.jpg'}">
                <div class="p-name">${p.name}</div>
                <div class="p-price">₹${p.price}</div>
            `;
            card.onclick = () => {
                currentP = p;
                document.getElementById('det-img').src = p.images[0];
                document.getElementById('det-name').innerText = p.name;
                document.getElementById('det-price').innerText = "₹" + p.price;
                document.getElementById('det-desc').innerText = p.desc || "Premium Quality Product";
                document.getElementById('detail-view').style.display = 'block';
            };
            list.appendChild(card);
        });
    }

    window.showOrders = async () => {
        const cont = document.getElementById('orderListContainer');
        cont.innerHTML = "<p style='text-align:center;padding:20px;'>Loading...</p>";
        document.getElementById('orders-view').style.display = 'block';
        const uPhone = localStorage.getItem('dk_user_ph');
        if(!uPhone) { cont.innerHTML = "<p style='text-align:center;padding:20px;'>No Orders Found</p>"; return; }

        const q = query(collection(db, "orders"), where("phone", "==", uPhone), orderBy("time", "desc"));
        const snap = await getDocs(q);
        cont.innerHTML = "";
        snap.forEach(doc => {
            const o = doc.data();
            const status = o.status || "Pending";
            cont.innerHTML += `
                <div class="order-card" onclick="openTracking('${status}', '${o.name}')">
                    <img src="${o.img}" class="order-img">
                    <div style="flex:1">
                        <h4 style="margin:0;color:var(--accent)">${o.name}</h4>
                        <p style="margin:3px 0;font-size:14px;font-weight:800;">₹${o.price}</p>
                        <p style="margin:0;font-size:11px;color:#0f0;">Status: ${status} (Track)</p>
                    </div>
                </div>`;
        });
    };

    window.openTracking = (status, name) => {
        const stages = ["Pending", "Confirmed", "Packed", "Shipped", "Delivered"];
        let curIdx = stages.indexOf(status);
        if(curIdx === -1) curIdx = 0;

        let html = `<h3 style="color:var(--accent);">${name}</h3>`;
        stages.forEach((s, i) => {
            html += `<div class="step-row ${i <= curIdx ? 'step-active' : ''}">
                ${i < stages.length-1 ? '<div class="step-line"></div>' : ''}
                <div class="step-dot"></div>
                <div class="step-text">${s}</div>
            </div>`;
        });
        document.getElementById('trackingContent').innerHTML = html;
        document.getElementById('tracking-view').style.display = 'block';
    };

    document.getElementById('order-btn').onclick = async () => {
        const ph = document.getElementById('c-phone').value;
        const name = document.getElementById('c-name').value;
        if(!ph || !name) return alert("Details bharo!");

        await addDoc(collection(db, "orders"), {
            name: currentP.name, price: currentP.price, img: currentP.images[0],
            phone: ph, customer: name, time: serverTimestamp(), status: "Pending"
        });
        localStorage.setItem('dk_user_ph', ph);
        alert("Order Successful! ✅");
        location.reload();
    };

    window.isWished = (id) => (JSON.parse(localStorage.getItem('dk_wish')) || []).includes(id);
    window.toggleWish = (e, id) => { e.stopPropagation(); let w = JSON.parse(localStorage.getItem('dk_wish')) || []; if(w.includes(id)) w = w.filter(i=>i!==id); else w.push(id); localStorage.setItem('dk_wish', JSON.stringify(w)); render(allP, 'productList'); };
    window.showWishlist = () => { const w = JSON.parse(localStorage.getItem('dk_wish')) || []; render(allP.filter(p => w.includes(p.id)), 'wishlistGrid'); document.getElementById('wishlist-view').style.display = 'block'; };
    window.searchFun = () => render(allP.filter(p => p.name.toLowerCase().includes(document.getElementById('searchInput').value.toLowerCase())), 'productList');
    window.closeAll = () => document.getElementById('detail-view').style.display = 'none';
    window.openCheckout = () => document.getElementById('checkout-view').style.display = 'block';
    window.closeCheckout = () => document.getElementById('checkout-view').style.display = 'none';
    window.hideAllViews = () => document.querySelectorAll('.full-view').forEach(v => v.style.display = 'none');
    window.filterCat = (c) => c === 'All' ? render(allP, 'productList') : render(allP.filter(p => p.category === c), 'productList');

    load();
</script>
</body>
</html>
