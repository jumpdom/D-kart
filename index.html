<!DOCTYPE html>
<html lang="hi">
<head>
    <!-- Google Search Console Tag -->
    <meta name="google-site-verification" content="YAHAN_APNA_CODE_DALEIN" />

    <link rel="icon" type="image/jpeg" href="IMG_6363.jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Shop Online</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --primary: #000; --accent: #ffff00; --bg: #0a0a0a; --card: #151515; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; color: #fff; overflow-x: hidden; }
        
        /* Header & Logo */
        header { background: var(--primary); padding: 15px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 1000; }
        .logo-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .logo-img { width: 42px; height: 42px; border-radius: 8px; border: 1.5px solid var(--accent); object-fit: cover; }
        .brand { font-family: 'Montserrat', sans-serif; font-size: 26px; font-weight: 900; color: var(--accent); font-style: italic; }
        
        /* Search */
        .search-box { background: #1a1a1a; border-radius: 10px; display: flex; align-items: center; padding: 10px 15px; border: 1px solid #333; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; font-size: 14px; }

        /* Product Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .p-card { background: var(--card); padding: 10px; border-radius: 15px; border: 1px solid #222; position: relative; }
        .p-card img { width: 100%; height: 140px; object-fit: contain; border-radius: 10px; background: #fff; }
        .p-name { color: var(--accent); font-size: 12px; margin: 8px 0 4px; height: 32px; overflow: hidden; }
        .p-price { font-weight: 800; font-size: 16px; }

        /* Full Views */
        .full-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 3000; display: none; overflow-y: auto; }
        .view-header { padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #333; background: var(--primary); position: sticky; top: 0; }
        .view-header span { color: var(--accent); font-weight: 700; margin-left: 15px; }

        /* Size Selection */
        .size-wrap { display: flex; gap: 8px; margin: 15px 0; }
        .size-box { border: 1px solid #444; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .size-box.selected { background: var(--accent); color: #000; border-color: #fff; font-weight: bold; }

        /* Navigation */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; border-top: 2px solid var(--accent); z-index: 2000; height: 70px; align-items: center; }
        .nav-tab { flex: 1; text-align: center; color: #666; font-size: 10px; font-weight: 700; cursor: pointer; position: relative; }
        .nav-tab.active { color: var(--accent); }
        .nav-tab i { font-size: 22px; display: block; margin-bottom: 4px; }
        .badge { position: absolute; top: 5px; right: 25%; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; }

        .btn-buy { width: 100%; padding: 15px; background: var(--accent); color: #000; font-weight: 900; border: none; border-radius: 10px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<div id="home-sec">
    <header>
        <div class="logo-row">
            <img src="IMG_6363.jpeg" class="logo-img" onerror="this.src='Dkart.jpg'">
            <span class="brand">DKART</span>
        </div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass" style="color:var(--accent)"></i>
            <input type="text" id="searchInput" placeholder="Search clothes, mobiles...">
        </div>
    </header>
    <div class="grid" id="productList">
        <p style="text-align:center; grid-column: 1/3;">Loading products...</p>
    </div>
</div>

<!-- Details View -->
<div id="detail-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="closeView('detail-view')"></i><span>Product Info</span></div>
    <div id="detail-body" style="padding:20px;">
        <img id="det-img" style="width:100%; border-radius:15px; background:white;">
        <h2 id="det-name" style="margin:15px 0 5px; color:var(--accent);"></h2>
        <h3 id="det-price"></h3>
        <p style="color:#888;">Select Size:</p>
        <div class="size-wrap" id="sizeList"></div>
        <button class="btn-buy" onclick="addToCart()">ADD TO CART</button>
    </div>
</div>

<!-- Cart View -->
<div id="cart-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="closeView('cart-view')"></i><span>My Shopping Cart</span></div>
    <div id="cartItems" style="padding:15px;"></div>
    <div id="cartTotal" style="padding:20px; border-top:1px solid #333;">
        <button class="btn-buy" onclick="checkout()">Checkout (Cash on Delivery)</button>
    </div>
</div>

<!-- Orders View -->
<div id="orders-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="closeView('orders-view')"></i><span>Order Status</span></div>
    <div id="orderList" style="padding:15px;"></div>
</div>

<nav class="nav-bar">
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="nav-tab" onclick="openView('orders-view')"><i class="fa-solid fa-truck-fast"></i><span>Status</span></div>
    <div class="nav-tab" onclick="openView('cart-view')">
        <i class="fa-solid fa-cart-shopping"></i><span>Cart</span>
        <span class="badge" id="cartBadge">0</span>
    </div>
    <div class="nav-tab" onclick="alert('Profile Coming Soon')"><i class="fa-solid fa-user"></i><span>Account</span></div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE", authDomain: "dkart-87860.firebaseapp.com", projectId: "dkart-87860", appId: "1:894407834952:web:3067589b758c9819fe877d" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allProducts = [], cart = [], selectedP = null, selectedSize = null;

    // Load Products
    async function fetchProducts() {
        try {
            const snap = await getDocs(collection(db, "products"));
            allProducts = snap.docs.map(doc => ({id: doc.id, ...doc.data()}));
            renderProducts(allProducts);
        } catch (e) { document.getElementById('productList').innerHTML = "Check Internet!"; }
    }

    function renderProducts(data) {
        const container = document.getElementById('productList');
        container.innerHTML = data.map(p => `
            <div class="p-card" onclick="showProduct('${p.id}')">
                <img src="${p.images ? p.images[0] : 'Dkart.jpg'}" onerror="this.src='Dkart.jpg'">
                <div class="p-name">${p.name}</div>
                <div class="p-price">₹${p.price}</div>
            </div>
        `).join('');
    }

    // Product Details
    window.showProduct = (id) => {
        selectedP = allProducts.find(p => p.id === id);
        selectedSize = null;
        document.getElementById('det-img').src = selectedP.images[0];
        document.getElementById('det-name').innerText = selectedP.name;
        document.getElementById('det-price').innerText = "₹" + selectedP.price;
        
        const sizes = ['S', 'M', 'L', 'XL'];
        document.getElementById('sizeList').innerHTML = sizes.map(s => `<div class="size-box" onclick="setSize(this, '${s}')">${s}</div>`).join('');
        
        document.getElementById('detail-view').style.display = 'block';
    };

    window.setSize = (el, s) => {
        document.querySelectorAll('.size-box').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        selectedSize = s;
    };

    // Cart Logic
    window.addToCart = () => {
        if(!selectedSize) return alert("Bhai, Size toh select karo!");
        cart.push({...selectedP, size: selectedSize});
        localStorage.setItem('dk_cart', JSON.stringify(cart));
        updateBadge();
        alert("Cart mein add ho gaya! ✅");
        closeView('detail-view');
    };

    function updateBadge() {
        cart = JSON.parse(localStorage.getItem('dk_cart')) || [];
        document.getElementById('cartBadge').innerText = cart.length;
    }

    // UI Helpers
    window.openView = (id) => {
        document.querySelectorAll('.full-view').forEach(v => v.style.display = 'none');
        document.getElementById(id).style.display = 'block';
        if(id === 'cart-view') renderCart();
    };

    window.closeView = (id) => document.getElementById(id).style.display = 'none';

    function renderCart() {
        const cont = document.getElementById('cartItems');
        if(!cart.length) { cont.innerHTML = "Cart Khali Hai!"; return; }
        cont.innerHTML = cart.map((c, i) => `
            <div style="display:flex; gap:15px; margin-bottom:15px; background:#111; padding:10px; border-radius:10px;">
                <img src="${c.images[0]}" style="width:60px; height:60px; border-radius:5px;">
                <div>
                    <div style="font-size:13px; color:yellow;">${c.name}</div>
                    <div style="font-size:12px;">Size: ${c.size} | ₹${c.price}</div>
                    <button onclick="removeItem(${i})" style="color:red; background:none; border:none; padding:0; font-size:11px;">Remove</button>
                </div>
            </div>
        `).join('');
    }

    window.removeItem = (i) => {
        cart.splice(i, 1);
        localStorage.setItem('dk_cart', JSON.stringify(cart));
        renderCart();
        updateBadge();
    };

    // Search Logic
    document.getElementById('searchInput').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        renderProducts(allProducts.filter(p => p.name.toLowerCase().includes(val)));
    };

    updateBadge();
    fetchProducts();
</script>
</body>
</html>
