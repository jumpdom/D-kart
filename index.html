<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dkart | Dynamic Shopping</title>
    <style>
        /* Professional CSS */
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f3f6; color: #333; }
        
        /* Header & Navbar */
        .navbar { background: #2874f0; color: white; padding: 10px; position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: auto; display: flex; flex-direction: column; gap: 8px; }
        
        .nav-top { display: flex; align-items: center; justify-content: space-between; }
        
        /* Logo & BRAND Name */
        .brand-box { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .brand-box img { height: 38px; width: auto; border-radius: 4px; border: 1.5px solid white; }
        .brand-name { font-size: 24px; font-weight: 900; font-style: italic; color: white; }
        .brand-name span { color: #fb641b; } /* Orange color for 'kart' */

        /* Search Box */
        .search-area { display: flex; background: white; border-radius: 4px; overflow: hidden; }
        .search-area input { border: none; padding: 10px; flex: 1; outline: none; font-size: 14px; }
        .search-area button { border: none; background: white; padding: 0 15px; color: #2874f0; cursor: pointer; font-size: 16px; }

        /* Categories Scroll Bar */
        .category-bar { display: flex; background: white; overflow-x: auto; padding: 10px; gap: 10px; border-bottom: 1px solid #ddd; scrollbar-width: none; }
        .category-bar::-webkit-scrollbar { display: none; }
        .cat-btn { background: #f0f2f5; border: 1px solid #ddd; padding: 6px 15px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-size: 13px; font-weight: 500; }
        .cat-btn.active { background: #2874f0; color: white; border-color: #2874f0; }

        /* Product Grid */
        .container { max-width: 1200px; margin: 15px auto; padding: 0 10px; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (min-width: 768px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }

        .product-card { background: white; border-radius: 4px; overflow: hidden; border: 1px solid #e0e0e0; display: flex; flex-direction: column; transition: 0.3s; }
        .product-card img { width: 100%; height: 160px; object-fit: contain; padding: 10px; box-sizing: border-box; background: #fff; }
        .p-info { padding: 10px; flex-grow: 1; text-align: left; }
        .p-info h4 { margin: 5px 0; font-size: 13px; color: #212121; height: 35px; overflow: hidden; }
        .p-price { font-size: 17px; font-weight: bold; color: #212121; margin: 5px 0; }

        .btn-buy { background: #fb641b; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; font-size: 14px; text-transform: uppercase; border-radius: 2px; margin-top: auto; }

        /* Order Modal */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: white; width: 85%; max-width: 380px; margin: 15vh auto; padding: 20px; border-radius: 8px; }
        .modal-content input, .modal-content textarea { width: 100%; margin-bottom: 12px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .confirm-btn { background: #388e3c; color: white; border: none; width: 100%; padding: 14px; cursor: pointer; font-size: 16px; font-weight: bold; border-radius: 4px; }
        .close-btn { background: #f1f3f6; border: none; width: 100%; padding: 10px; margin-top: 8px; cursor: pointer; border-radius: 4px; color: #666; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <div class="nav-container">
            <div class="nav-top">
                <div class="brand-box" onclick="location.reload()">
                    <img src="Dkart.jpg" alt="Logo">
                    <div class="brand-name">D<span>kart</span></div>
                </div>
                <div style="font-size: 22px;">🛒</div>
            </div>
            <!-- Search Bar -->
            <div class="search-area">
                <input type="text" id="searchInput" onkeyup="searchProduct()" placeholder="Search dynamic products...">
                <button>🔍</button>
            </div>
        </div>
    </header>

    <!-- Categories -->
    <nav class="category-bar">
        <button class="cat-btn active" onclick="loadDynamicProducts('all', event)">All</button>
        <button class="cat-btn" onclick="loadDynamicProducts('men', event)">Men</button>
        <button class="cat-btn" onclick="loadDynamicProducts('women', event)">Women</button>
        <button class="cat-btn" onclick="loadDynamicProducts('gadgets', event)">Gadgets</button>
    </nav>

    <!-- Dynamic Product Grid -->
    <main class="container">
        <div class="product-grid" id="product-list">
            <!-- JavaScript data yahan daalega -->
            <h3 style="text-align:center; color:#666">Saman load ho raha hai...</h3>
        </div>
    </main>

    <!-- Order Popup -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3>Confirm Order</h3>
            <p id="item-summary" style="font-weight: bold; color: #2874f0;"></p>
            <input type="text" id="custName" placeholder="Aapka Naam">
            <input type="number" id="custPhone" placeholder="WhatsApp Number">
            <textarea id="custAddress" placeholder="Full Address with Pin Code" rows="3"></textarea>
            <button class="confirm-btn" onclick="sendToWhatsApp()">Confirm on WhatsApp</button>
            <button class="close-btn" onclick="document.getElementById('orderModal').style.display='none'">Cancel</button>
        </div>
    </div>

    <!-- Firebase Connection & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        // AAPKA CONFIG CODE
        const firebaseConfig = {
          apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
          authDomain: "dkart-87860.firebaseapp.com",
          projectId: "dkart-87860",
          storageBucket: "dkart-87860.firebasestorage.app",
          messagingSenderId: "894407834952",
          appId: "1:894407834952:web:3067589b758c9819fe877d",
          measurementId: "G-0DBRJM7JFN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let selectedProduct = "";
        let selectedPrice = "";

        // 1. Function to get product from Firebase
        window.loadDynamicProducts = async function(categoryFilter, event) {
            const grid = document.getElementById('product-list');
            grid.innerHTML = '<h3 style="text-align:center; color:#666">Loading Products...</h3>';

            try {
                // 'products' collection se saare document mangwayein
                const querySnapshot = await getDocs(collection(db, "products"));
                grid.innerHTML = ""; // Clear loader

                if (querySnapshot.empty) {
                    grid.innerHTML = '<p style="text-align:center; color:#666">Abhi tak koi saman add nahi kiya gaya hai.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();

                    // Agar filter check hai, toh usi category ko dikhayein
                    if (categoryFilter === 'all' || data.category === categoryFilter) {
                        const productCard = `
                            <div class="product-card">
                                <img src="${data.imgUrl}" alt="${data.name}">
                                <div class="p-info">
                                    <h4>${data.name}</h4>
                                    <p class="p-price">₹${data.price}</p>
                                    <button class="btn-buy" onclick="openOrderModal('${data.name}', '${data.price}')">Buy Now</button>
                                </div>
                            </div>
                        `;
                        grid.innerHTML += productCard;
                    }
                });

                // Update category button styling
                if (event) {
                    document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
                    event.target.classList.add('active');
                }

            } catch (error) {
                console.error("Error fetching documents: ", error);
                grid.innerHTML = '<p style="text-align:center; color:red">Galti ho gayi! Products load nahi ho paye.</p>';
            }
        }

        // 2. Order popup functions
        window.openOrderModal = function(name, price) {
            selectedProduct = name;
            selectedPrice = price;
            document.getElementById('item-summary').innerText = name + " - ₹" + price;
            document.getElementById('orderModal').style.display = "block";
        }

        // 3. WhatsApp order send function
        window.sendToWhatsApp = function() {
            let name = document.getElementById('custName').value;
            let phone = document.getElementById('custPhone').value;
            let address = document.getElementById('custAddress').value;

            if(!name || !phone || !address) { alert("Please fill details!"); return; }

            let msg = `*New Order Confirmed!*%0A%0A*Item:* ${selectedProduct}%0A*Price:* ₹${selectedPrice}%0A%0A*Customer:* ${name}%0A*Contact:* ${phone}%0A*Address:* ${address}`;
            window.open(`https://api.whatsapp.com/send?phone=918521684137&text=${msg}`, '_blank');
            document.getElementById('orderModal').style.display='none';
        }

        // Initial Load on Page Open
        window.addEventListener('load', () => loadDynamicProducts('all'));

    </script>
</body>
</html>
