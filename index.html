<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Premium Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #000000; --accent: #ffff00; --white: #ffffff; --bg: #0a0a0a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; color: var(--white); overflow-x: hidden; }

        /* Header */
        header { background: var(--primary); padding: 15px 10px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 1000; }
        .logo-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .brand { font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 900; color: var(--accent); font-style: italic; }
        
        /* Search */
        .search-container { padding: 10px; }
        .search-box { background: #1a1a1a; border-radius: 8px; display: flex; align-items: center; padding: 10px 15px; border: 1px solid #333; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .p-card { background: #151515; padding: 10px; border-radius: 12px; border: 1.5px solid var(--white); position: relative; }
        .p-card img { width: 100%; height: 140px; object-fit: contain; background: #222; border-radius: 8px; }
        .wish-btn { position: absolute; top: 15px; right: 15px; color: #555; font-size: 18px; z-index: 5; }
        .wish-btn.active { color: #ff0055; }
        .p-name { font-size: 12px; font-weight: 600; color: var(--accent); margin-top: 8px; height: 35px; overflow: hidden; }
        .p-price { font-size: 16px; font-weight: 800; }

        /* Navigation */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; border-top: 2px solid var(--accent); z-index: 3000; height: 65px; }
        .nav-tab { flex: 1; text-align: center; color: #777; padding: 10px 0; font-size: 10px; font-weight: 700; }
        .nav-tab.active { color: var(--accent); }
        .nav-tab i { font-size: 20px; display: block; margin-bottom: 3px; }

        /* Views */
        .full-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 4000; display: none; overflow-y: auto; }
        .view-header { padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #333; background: var(--primary); position: sticky; top: 0; }
        .view-header span { color: var(--accent); font-weight: 700; margin-left: 15px; }

        /* Order Card in My Orders */
        .order-item { background: #1a1a1a; margin: 10px; padding: 12px; border-radius: 10px; border-left: 4px solid var(--accent); display: flex; gap: 12px; }
        .order-img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; background: #222; }
        .order-det h4 { margin: 0; font-size: 14px; color: var(--accent); }
        .order-det p { margin: 4px 0; font-size: 12px; color: #aaa; }

        /* Payment Method UI */
        .pay-method { background: #1a1a1a; padding: 15px; border-radius: 10px; border: 1px solid #333; margin-top: 15px; }
        .cod-tag { display: flex; align-items: center; gap: 10px; color: var(--accent); font-weight: 800; }

        .btn-box { position: fixed; bottom: 0; width: 100%; height: 60px; z-index: 4500; }
        .btn-main { width: 100%; height: 100%; border: none; font-weight: 900; background: var(--accent); color: #000; font-size: 16px; }
    </style>
</head>
<body>

<div id="home-sec">
    <header>
        <div class="logo-row"><span class="brand">DKART</span></div>
        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--accent)"></i>
                <input type="text" id="searchInput" placeholder="Search..." onkeyup="searchFun()">
            </div>
        </div>
    </header>
    <div class="grid" id="productList"></div>
</div>

<!-- Details View -->
<div id="detail-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="closeAll()"></i><span>PRODUCT DETAILS</span></div>
    <div style="padding: 20px; text-align: center;">
        <img id="det-img" style="width: 100%; border-radius: 12px;">
        <h2 id="det-name" style="color: var(--accent); margin-top: 15px;"></h2>
        <div id="det-price" style="font-size: 26px; font-weight: 800;"></div>
    </div>
    <div class="btn-box"><button class="btn-main" onclick="openCheckout()">PROCEED TO CHECKOUT</button></div>
</div>

<!-- Checkout View -->
<div id="checkout-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="closeCheckout()"></i><span>CHECKOUT</span></div>
    <div style="padding: 20px;">
        <input type="text" id="c-name" placeholder="Full Name" style="width:100%; padding:15px; margin-bottom:10px; background:#111; color:white; border:1px solid #333; border-radius:8px;">
        <input type="tel" id="c-phone" placeholder="Phone Number" style="width:100%; padding:15px; margin-bottom:10px; background:#111; color:white; border:1px solid #333; border-radius:8px;">
        <textarea id="c-addr" placeholder="Delivery Address" style="width:100%; padding:15px; background:#111; color:white; border:1px solid #333; border-radius:8px;" rows="3"></textarea>
        
        <div class="pay-method">
            <p style="margin:0 0 10px 0; font-size: 12px; color: #888;">PAYMENT METHOD</p>
            <div class="cod-tag">
                <i class="fa-solid fa-circle-check"></i> CASH ON DELIVERY (COD)
            </div>
        </div>
    </div>
    <div class="btn-box"><button class="btn-main" id="order-btn">CONFIRM ORDER</button></div>
</div>

<!-- My Orders View -->
<div id="orders-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="hideOrders()"></i><span>MY ORDERS</span></div>
    <div id="orderListContainer"></div>
</div>

<!-- Wishlist View -->
<div id="wishlist-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="hideWishlist()"></i><span>MY WISHLIST</span></div>
    <div class="grid" id="wishlistGrid"></div>
</div>

<nav class="nav-bar">
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="nav-tab" onclick="showOrders()"><i class="fa-solid fa-bag-shopping"></i><span>My Orders</span></div>
    <div class="nav-tab" onclick="showWishlist()"><i class="fa-solid fa-heart"></i><span>Wishlist</span></div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allP = [], currentP = null;

    async function load() {
        const q = query(collection(db, "products"), orderBy("time", "desc"));
        const snap = await getDocs(q);
        allP = snap.docs.map(d => ({id: d.id, ...d.data()}));
        render(allP, 'productList');
    }

    function render(data, targetId) {
        const list = document.getElementById(targetId);
        list.innerHTML = "";
        data.forEach(p => {
            const card = document.createElement('div');
            card.className = 'p-card';
            card.innerHTML = `
                <i class="fa-solid fa-heart wish-btn" onclick="toggleWish(event, '${p.id}')"></i>
                <img src="${p.images[0] || 'Dkart.jpg'}">
                <div class="p-name">${p.name}</div>
                <div class="p-price">₹${p.price}</div>
            `;
            card.onclick = () => {
                currentP = p;
                document.getElementById('det-img').src = p.images[0] || 'Dkart.jpg';
                document.getElementById('det-name').innerText = p.name;
                document.getElementById('det-price').innerText = "₹" + p.price;
                document.getElementById('detail-view').style.display = 'block';
            };
            list.appendChild(card);
        });
    }

    // Wishlist Logic
    window.toggleWish = (e, id) => {
        e.stopPropagation();
        let wish = JSON.parse(localStorage.getItem('dkart_wish')) || [];
        if(wish.includes(id)) wish = wish.filter(i => i !== id);
        else wish.push(id);
        localStorage.setItem('dkart_wish', JSON.stringify(wish));
        alert("Wishlist Updated!");
    };

    window.showWishlist = () => {
        const wishIds = JSON.parse(localStorage.getItem('dkart_wish')) || [];
        const filtered = allP.filter(p => wishIds.includes(p.id));
        render(filtered, 'wishlistGrid');
        document.getElementById('wishlist-view').style.display = 'block';
    };

    // My Orders Logic
    window.showOrders = () => {
        const orders = JSON.parse(localStorage.getItem('my_orders')) || [];
        const container = document.getElementById('orderListContainer');
        container.innerHTML = orders.length ? "" : "<p style='text-align:center; margin-top:50px;'>No orders yet!</p>";
        orders.forEach(o => {
            container.innerHTML += `
                <div class="order-item">
                    <img src="${o.img}" class="order-img">
                    <div class="order-det">
                        <h4>${o.name}</h4>
                        <p>Price: ₹${o.price}</p>
                        <p style="color: #00ff00; font-weight:700;">Status: ${o.status}</p>
                    </div>
                </div>
            `;
        });
        document.getElementById('orders-view').style.display = 'block';
    };

    document.getElementById('order-btn').onclick = async () => {
        const n = document.getElementById('c-name').value, ph = document.getElementById('c-phone').value, ad = document.getElementById('c-addr').value;
        if(!n || !ph || !ad) return alert("Bhai, details bhariye!");
        
        const orderData = { 
            name: currentP.name, price: currentP.price, img: currentP.images[0], status: 'Confirmed' 
        };
        
        await addDoc(collection(db, "orders"), { ...orderData, customer: n, phone: ph, address: ad, time: serverTimestamp() });
        
        // Save to local for "My Orders" tab
        let myOrders = JSON.parse(localStorage.getItem('my_orders')) || [];
        myOrders.unshift(orderData);
        localStorage.setItem('my_orders', JSON.stringify(myOrders));
        
        alert("Order Placed Successfully! ✅");
        location.reload();
    };

    window.closeAll = () => document.getElementById('detail-view').style.display = 'none';
    window.openCheckout = () => document.getElementById('checkout-view').style.display = 'block';
    window.closeCheckout = () => document.getElementById('checkout-view').style.display = 'none';
    window.hideOrders = () => document.getElementById('orders-view').style.display = 'none';
    window.hideWishlist = () => document.getElementById('wishlist-view').style.display = 'none';

    load();
</script>
</body>
</html>
