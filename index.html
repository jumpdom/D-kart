<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Stylish Shopping</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2874f0; --secondary: #fb641b; --bg: #f1f3f6; }
        
        body { font-family: 'Roboto', sans-serif; background: var(--bg); margin: 0; padding-bottom: 70px; overflow-x: hidden; }

        /* Stylish Header */
        header { background: var(--primary); color: white; padding: 10px 15px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .app-bar { display: flex; justify-content: space-between; align-items: center; }
        
        /* Logo & Stylish Text */
        .logo-section { display: flex; align-items: center; gap: 8px; }
        .brand-logo { height: 36px; width: 36px; border-radius: 8px; object-fit: cover; border: 2px solid white; }
        .brand-name { 
            font-family: 'Montserrat', sans-serif; 
            font-size: 22px; 
            font-weight: 800; 
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .header-icons { display: flex; gap: 18px; font-size: 20px; }
        .cart-badge { position: absolute; top: -8px; right: -10px; background: var(--secondary); color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; font-weight: bold; border: 1.5px solid var(--primary); }

        /* Search Bar */
        .search-area { background: var(--primary); padding: 0 12px 10px 12px; }
        .search-input-box { background: white; display: flex; align-items: center; padding: 10px 15px; border-radius: 6px; }
        .search-input-box i { color: #999; margin-right: 10px; }
        .search-input-box input { border: none; outline: none; width: 100%; font-size: 14px; }

        /* App Layout Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .product-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .img-container { height: 180px; padding: 10px; display: flex; align-items: center; justify-content: center; position: relative; }
        .img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .p-details { padding: 10px; }
        .p-title { font-size: 13px; font-weight: 500; height: 35px; overflow: hidden; color: #333; }
        .p-price-row { margin-top: 8px; display: flex; align-items: baseline; gap: 5px; }
        .p-new { font-size: 17px; font-weight: bold; color: #000; }
        .p-old { font-size: 12px; color: #878787; text-decoration: line-through; }
        
        .buy-now-btn { background: var(--secondary); color: white; border: none; width: 100%; padding: 10px; font-weight: bold; font-size: 13px; border-radius: 5px; margin-top: 10px; cursor: pointer; }

        /* Floating Navigation bar */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; z-index: 2000; }
        .nav-tab { text-align: center; color: #666; text-decoration: none; font-size: 10px; }
        .nav-tab i { font-size: 20px; display: block; margin-bottom: 3px; }
        .nav-tab.active { color: var(--primary); }
    </style>
</head>
<body>

<header>
    <div class="app-bar">
        <div class="logo-section">
            <img src="Dkart.jpg" alt="Logo" class="brand-logo">
            <span class="brand-name">Dkart</span>
        </div>
        <div class="header-icons">
            <i class="far fa-heart"></i>
            <div style="position:relative;">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" id="cartCount">0</span>
            </div>
        </div>
    </div>
</header>

<div class="search-area">
    <div class="search-input-box">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search for products...">
    </div>
</div>

<div class="grid" id="mainProducts">
    </div>

<nav class="nav-bar">
    <a href="#" class="nav-tab active"><i class="fas fa-home"></i>Home</a>
    <a href="#" class="nav-tab"><i class="fas fa-th-large"></i>Categories</a>
    <a href="#" class="nav-tab"><i class="fas fa-shopping-bag"></i>Orders</a>
    <a href="#" class="nav-tab"><i class="fas fa-user-circle"></i>Profile</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      storageBucket: "dkart-87860.firebasestorage.app",
      messagingSenderId: "894407834952",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function showData() {
        const list = document.getElementById('mainProducts');
        const q = query(collection(db, "products"), orderBy("time", "desc"));
        const snap = await getDocs(q);
        list.innerHTML = "";

        snap.forEach(doc => {
            const data = doc.data();
            const imgUrl = (data.images && data.images.length > 0) ? data.images[0] : 'Dkart.jpg';
            
            list.innerHTML += `
                <div class="product-card">
                    <div class="img-container">
                        <img src="${imgUrl}">
                    </div>
                    <div class="p-details">
                        <div class="p-title">${data.name}</div>
                        <div class="p-price-row">
                            <span class="p-new">₹${data.price}</span>
                            <span class="p-old">₹${Math.floor(data.price * 1.5)}</span>
                        </div>
                        <button class="buy-now-btn">Buy Now</button>
                    </div>
                </div>`;
        });
    }

    showData();
</script>

</body>
</html>
