<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Premium Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2874f0; --bg: #f1f3f6; --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 70px; }

        /* Header */
        header { background: var(--primary); color: white; padding: 10px 15px; position: sticky; top: 0; z-index: 1000; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .logo-box { display: flex; align-items: center; gap: 8px; }
        .logo-img { width: 30px; height: 30px; border-radius: 4px; }
        .brand { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 900; font-style: italic; }

        /* Home View Styles */
        .search-box { background: var(--white); border-radius: 4px; display: flex; align-items: center; padding: 8px 12px; margin-bottom: 5px; }
        .search-box input { border: none; width: 100%; margin-left: 10px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
        .p-card { background: var(--white); padding: 10px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); cursor: pointer; }
        .p-card img { width: 100%; height: 140px; object-fit: contain; }
        .p-name { font-size: 13px; height: 36px; overflow: hidden; margin-top: 8px; color: #212121; }
        .p-price { font-weight: 800; font-size: 16px; margin: 5px 0; color: #000; }

        /* Product Detail View (Hidden by default) */
        #detail-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: none; overflow-y: auto; }
        .det-header { padding: 15px; display: flex; align-items: center; background: white; border-bottom: 1px solid #eee; position: sticky; top: 0; }
        .det-img-container { width: 100%; height: 350px; background: white; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .det-img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .det-info { padding: 20px; }
        .det-price { font-size: 24px; font-weight: 800; color: #000; margin: 10px 0; }
        .det-btn-box { position: fixed; bottom: 0; width: 100%; display: flex; height: 55px; border-top: 1px solid #ddd; }
        .btn-cart { flex: 1; background: white; font-weight: 700; border: none; }
        .btn-buy { flex: 1; background: #ff9f00; color: white; font-weight: 700; border: none; }

        /* Navigation */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; z-index: 1000; }
        .nav-tab { flex: 1; text-align: center; padding: 10px 0; color: #666; font-size: 10px; font-weight: 600; cursor: pointer; }
        .nav-tab.active { color: var(--primary); }
    </style>
</head>
<body>

<!-- Home Page -->
<div id="home-page">
    <header>
        <div class="top-bar">
            <div class="logo-box">
                <img src="Dkart.jpg" class="logo-img">
                <span class="brand">Dkart</span>
            </div>
            <i class="fa-solid fa-cart-shopping"></i>
        </div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass" style="color: #999;"></i>
            <input type="text" placeholder="Search for products...">
        </div>
    </header>
    <div class="grid" id="productList">
        <!-- Products load here -->
    </div>
</div>

<!-- Flipkart Style Detail Page -->
<div id="detail-view">
    <div class="det-header">
        <i class="fa-solid fa-arrow-left" onclick="closeDetails()" style="font-size: 20px; margin-right: 20px;"></i>
        <span style="font-weight: 600;">Product View</span>
    </div>
    <div class="det-img-container">
        <img id="det-img" src="">
    </div>
    <div class="det-info">
        <div id="det-name" style="font-size: 16px; font-weight: 600;"></div>
        <div style="color: #388e3c; font-weight: 700; font-size: 14px; margin-top: 10px;">Special Price</div>
        <div id="det-price" class="det-price"></div>
        <p style="color: #666; font-size: 14px;">High quality product. Fast delivery guaranteed by Dkart.</p>
    </div>
    <div class="det-btn-box">
        <button class="btn-cart">ADD TO CART</button>
        <button class="btn-buy" id="buy-btn">BUY NOW</button>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-tab active"><i class="fa-solid fa-house" style="display:block; font-size:18px;"></i>Home</div>
    <div class="nav-tab" onclick="alert('Profile section under update!')"><i class="fa-solid fa-user" style="display:block; font-size:18px;"></i>Profile</div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. Products Load Karne Ka Function
    async function loadProducts() {
        const q = query(collection(db, "products"), orderBy("time", "desc"));
        const snap = await getDocs(q);
        const list = document.getElementById('productList');
        list.innerHTML = "";

        snap.forEach(d => {
            const p = d.data();
            const card = document.createElement('div');
            card.className = 'p-card';
            card.innerHTML = `
                <img src="${p.images[0] || 'Dkart.jpg'}">
                <div class="p-name">${p.name}</div>
                <div class="p-price">₹${p.price}</div>
            `;
            // Click Event Add Kiya
            card.onclick = () => openProduct(p);
            list.appendChild(card);
        });
    }

    // 2. Product Detail Kholne Ka Function
    window.openProduct = (p) => {
        document.getElementById('det-img').src = p.images[0] || 'Dkart.jpg';
        document.getElementById('det-name').innerText = p.name;
        document.getElementById('det-price').innerText = "₹" + p.price;
        
        // Detail View Show Karna
        document.getElementById('detail-view').style.display = 'block';
        window.scrollTo(0, 0); // Page ke upar le jane ke liye
    };

    // 3. Detail Page Close Karne Ka Function
    window.closeDetails = () => {
        document.getElementById('detail-view').style.display = 'none';
    };

    loadProducts();
</script>
</body>
</html>
