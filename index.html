<!-- index.html mein ye CSS add karein -->
<style>
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 3000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; }
    .modal-content h3 { margin-top: 0; color: var(--primary); }
    .modal-content input, .modal-content textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
    .order-summary { background: #f9f9f9; padding: 10px; border-radius: 5px; margin-bottom: 10px; font-size: 14px; }
    .cod-box { border: 2px solid var(--primary); padding: 10px; border-radius: 5px; display: flex; align-items: center; gap: 10px; margin: 10px 0; }
    .conf-btn { background: var(--success, #28a745); color: white; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 5px; cursor: pointer; }
</style>

<!-- Body ke aakhir mein ye HTML add karein -->
<div class="modal" id="orderModal">
    <div class="modal-content">
        <h3>Confirm Your Order</h3>
        <div id="itemSummary" class="order-summary"></div>
        
        <input type="text" id="custName" placeholder="Aapka Naam" required>
        <input type="number" id="custPhone" placeholder="Mobile Number" required>
        <textarea id="custAddr" placeholder="Pura Address (House No, Area, City, PIN)" rows="3" required></textarea>
        
        <div class="cod-box">
            <input type="radio" checked> 
            <span><strong>Cash on Delivery (COD)</strong></span>
        </div>
        
        <button class="conf-btn" onclick="placeOrder()">Confirm Order</button>
        <button onclick="closeModal()" style="width:100%; border:none; background:none; color:gray; margin-top:10px;">Cancel</button>
    </div>
</div>

<script type="module">
    // ... (Firebase Initialize wala purana code) ...
    import { getFirestore, collection, addDoc, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    let currentItem = {};

    window.openOrderForm = function(name, price) {
        currentItem = { name, price };
        document.getElementById('itemSummary').innerHTML = `<strong>Item:</strong> ${name}<br><strong>Total:</strong> ₹${price}`;
        document.getElementById('orderModal').style.display = 'flex';
    }

    window.closeModal = function() { document.getElementById('orderModal').style.display = 'none'; }

    window.placeOrder = async function() {
        const name = document.getElementById('custName').value;
        const phone = document.getElementById('custPhone').value;
        const addr = document.getElementById('custAddr').value;

        if(!name || !phone || !addr) { alert("Sari details bhariye!"); return; }

        try {
            await addDoc(collection(db, "orders"), {
                customerName: name,
                customerPhone: phone,
                address: addr,
                productName: currentItem.name,
                price: currentItem.price,
                status: "Pending",
                method: "COD",
                time: new Date()
            });
            alert("Order Successful! Hum aapse jaldi contact karenge.");
            closeModal();
        } catch(e) { alert("Error: " + e.message); }
    }
    // Update LoadData function mein Buy Now button ko badle:
    // list.innerHTML += `... <button class="buy-btn" onclick="openOrderForm('${data.name}', '${data.price}')">BUY NOW</button> ...`;
</script>
