<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Premium Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --primary: #000000; 
            --accent: #ffff00; /* Yellow */
            --white: #ffffff; 
            --bg: #121212; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 70px; color: var(--white); }

        /* Header Fix */
        header { 
            background: var(--primary); 
            padding: 15px; 
            text-align: center; 
            border-bottom: 2px solid var(--accent);
            position: sticky; top: 0; z-index: 1000;
        }
        .brand { 
            font-family: 'Montserrat', sans-serif; 
            font-size: 24px; 
            font-weight: 900; 
            color: var(--accent); 
            font-style: italic;
        }

        /* Product Grid & Card Styling */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        
        .p-card { 
            background: #1e1e1e; 
            padding: 10px; 
            border-radius: 12px; 
            /* Black & White Border Fix */
            border: 1.5px solid var(--white); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: 0.3s;
        }
        .p-card img { 
            width: 100%; 
            height: 140px; 
            object-fit: contain; 
            border-radius: 8px;
            background: #252525;
            padding: 5px;
        }
        
        /* Yellow Text Styling */
        .p-name { 
            font-size: 13px; 
            font-weight: 600; 
            color: var(--accent); /* Yellow Text */
            margin-top: 10px; 
            height: 38px; 
            overflow: hidden; 
            text-transform: uppercase;
        }
        .p-price { 
            font-size: 17px; 
            font-weight: 800; 
            color: var(--white); 
            margin: 5px 0;
        }

        /* Detail & Checkout Views */
        .full-view { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg); z-index: 2000; display: none; overflow-y: auto; 
        }
        .view-header { 
            padding: 15px; display: flex; align-items: center; 
            border-bottom: 1px solid #333; background: var(--primary);
        }
        .view-header span { color: var(--accent); font-weight: 700; margin-left: 15px; }

        .det-content { padding: 20px; text-align: center; }
        .det-img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 10px; margin-bottom: 20px; }

        /* Forms & Buttons */
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: var(--accent); margin-bottom: 5px; font-weight: 600; }
        .input-group input, .input-group textarea { 
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; 
            background: #222; color: white; font-family: inherit;
        }

        .btn-box { position: fixed; bottom: 0; width: 100%; display: flex; height: 55px; }
        .btn-main { 
            flex: 1; border: none; font-weight: 800; font-size: 16px; cursor: pointer;
            background: var(--accent); color: black; transition: 0.3s;
        }
        .btn-main:active { background: #d4d400; }

        /* Navigation */
        .nav-bar { 
            position: fixed; bottom: 0; width: 100%; background: #000; 
            display: flex; border-top: 1px solid #333; z-index: 1000; 
        }
        .nav-tab { flex: 1; text-align: center; padding: 12px 0; color: #777; font-size: 10px; font-weight: 600; }
        .nav-tab.active { color: var(--accent); }
    </style>
</head>
<body>

<!-- Home Section -->
<div id="home-sec">
    <header>
        <span class="brand">DKART</span>
    </header>
    <div class="grid" id="productList"></div>
</div>

<!-- Product Detail View -->
<div id="detail-view" class="full-view">
    <div class="view-header">
        <i class="fa-solid fa-arrow-left" onclick="closeAll()" style="font-size: 20px; color: white;"></i>
        <span>Product View</span>
    </div>
    <div class="det-content">
        <img id="det-img" class="det-img">
        <h2 id="det-name" style="color: var(--accent); margin-bottom: 5px;"></h2>
        <div id="det-price" style="font-size: 26px; font-weight: 800; margin-bottom: 20px;"></div>
        <p style="color: #bbb; font-size: 13px;">Special handcrafted quality. Faster delivery in Bangalore & nearby areas.</p>
    </div>
    <div class="btn-box">
        <button class="btn-main" onclick="openCheckout()">BUY NOW</button>
    </div>
</div>

<!-- Checkout View -->
<div id="checkout-view" class="full-view">
    <div class="view-header">
        <i class="fa-solid fa-arrow-left" onclick="closeCheckout()" style="font-size: 20px; color: white;"></i>
        <span>Delivery Details</span>
    </div>
    <div style="padding: 20px;">
        <div class="input-group">
            <label>FULL NAME</label>
            <input type="text" id="c-name" placeholder="Enter your name">
        </div>
        <div class="input-group">
            <label>MOBILE NUMBER</label>
            <input type="tel" id="c-phone" placeholder="Enter 10-digit phone">
        </div>
        <div class="input-group">
            <label>FULL ADDRESS</label>
            <textarea id="c-addr" rows="3" placeholder="Village/City, Pin Code, Landmark"></textarea>
        </div>
        <div style="background: #222; padding: 15px; border-radius: 8px; border: 1px dashed var(--accent);">
            <p style="margin:0; color: var(--accent); font-weight: 800; font-size: 14px;">
                <i class="fa-solid fa-truck"></i> Cash on Delivery Available
            </p>
        </div>
    </div>
    <div class="btn-box">
        <button class="btn-main" id="order-btn">CONFIRM ORDER</button>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-tab active"><i class="fa-solid fa-house" style="display:block; font-size:18px;"></i>HOME</div>
    <div class="nav-tab" onclick="alert('Wait for Login feature!')"><i class="fa-solid fa-user" style="display:block; font-size:18px;"></i>ACCOUNT</div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let currentP = null;

    async function getProducts() {
        const q = query(collection(db, "products"), orderBy("time", "desc"));
        const snap = await getDocs(q);
        const list = document.getElementById('productList');
        list.innerHTML = "";
        snap.forEach(d => {
            const p = d.data();
            const card = document.createElement('div');
            card.className = 'p-card';
            card.innerHTML = `
                <img src="${p.images[0] || 'Dkart.jpg'}">
                <div class="p-name">${p.name}</div>
                <div class="p-price">₹${p.price}</div>
            `;
            card.onclick = () => {
                currentP = p;
                document.getElementById('det-img').src = p.images[0] || 'Dkart.jpg';
                document.getElementById('det-name').innerText = p.name;
                document.getElementById('det-price').innerText = "₹" + p.price;
                document.getElementById('detail-view').style.display = 'block';
            };
            list.appendChild(card);
        });
    }

    window.closeAll = () => document.getElementById('detail-view').style.display = 'none';
    window.openCheckout = () => document.getElementById('checkout-view').style.display = 'block';
    window.closeCheckout = () => document.getElementById('checkout-view').style.display = 'none';

    document.getElementById('order-btn').onclick = async () => {
        const n = document.getElementById('c-name').value;
        const ph = document.getElementById('c-phone').value;
        const ad = document.getElementById('c-addr').value;

        if(!n || !ph || !ad) return alert("Bhai, saari details dalo!");

        const btn = document.getElementById('order-btn');
        btn.innerText = "Placing Order...";
        btn.disabled = true;

        try {
            await addDoc(collection(db, "orders"), {
                productName: currentP.name,
                price: currentP.price,
                customer: n,
                phone: ph,
                address: ad,
                status: "Pending",
                time: serverTimestamp()
            });
            alert("Order Ho Gaya! Admin Panel check karein. ✅");
            location.reload();
        } catch(e) {
            alert("Error: " + e.message);
            btn.disabled = false;
        }
    };

    getProducts();
</script>
</body>
</html>
