<!DOCTYPE html>
<html lang="hi">
<head>
    <link rel="icon" type="image/jpeg" href="IMG_6363.jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Premium Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #000; --accent: #ffff00; --white: #fff; --bg: #0a0a0a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; color: var(--white); }
        
        header { background: var(--primary); padding: 15px 10px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 1000; }
        .logo-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .logo-img { width: 45px; height: 45px; border-radius: 8px; border: 1.5px solid var(--white); object-fit: cover; }
        .brand { font-family: 'Montserrat', sans-serif; font-size: 28px; font-weight: 900; color: var(--accent); font-style: italic; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .p-card { background: #111; padding: 12px; border-radius: 12px; border: 1.5px solid #333; }
        .p-card img { width: 100%; height: 140px; object-fit: contain; border-radius: 8px; background: #050505; }
        
        .full-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 3000; display: none; overflow-y: auto; padding-bottom: 90px; }
        .view-header { padding: 15px; background: #000; display: flex; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; }
        .view-header span { margin-left: 15px; font-weight: 800; color: var(--accent); }

        .desc-container { padding: 15px; }
        .desc-img { width: 100%; border-radius: 15px; border: 1px solid #333; margin-bottom: 15px; }
        .desc-title { font-size: 20px; font-weight: 800; color: var(--accent); margin-bottom: 10px; }
        .desc-text { color: #ccc; font-size: 14px; line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; }

        .size-list { display: flex; gap: 8px; margin: 15px 0; }
        .s-box { padding: 8px 15px; border: 1px solid #444; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .s-box.selected { background: var(--accent); color: #000; border-color: #fff; }

        .form-group { padding: 20px; }
        .form-group input, .form-group textarea { width: 100%; padding: 15px; margin-bottom: 10px; background: #111; color: white; border: 1px solid #333; border-radius: 8px; }
        
        .action-btn { width: 100%; background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 8px; font-weight: 900; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>

<div id="home-sec">
    <header>
        <div class="logo-row"><img src="IMG_6363.jpeg" class="logo-img"><span class="brand">DKART</span></div>
    </header>
    <div class="grid" id="productList"></div>
</div>

<!-- Description View -->
<div id="desc-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="closeView('desc-view')"></i><span>PRODUCT DETAILS</span></div>
    <div class="desc-container" id="desc-content"></div>
</div>

<!-- Checkout View -->
<div id="checkout-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="closeView('checkout-view')"></i><span>CONFIRM ORDER</span></div>
    <div class="form-group">
        <h3 id="order-item"></h3>
        <input type="text" id="c-name" placeholder="Apna Naam">
        <input type="tel" id="c-phone" placeholder="Mobile Number">
        <textarea id="c-addr" placeholder="Pura Address" rows="3"></textarea>
        <button class="action-btn" id="confirm-order-btn">ORDER CONFIRM (COD)</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allProducts = [], currentProduct = null, selectedSize = null;

    async function load() {
        const q = query(collection(db, "products"), orderBy("time", "desc"));
        const snap = await getDocs(q);
        allProducts = snap.docs.map(d => ({id: d.id, ...d.data()}));
        render(allProducts);
    }

    function render(data) {
        const list = document.getElementById('productList');
        list.innerHTML = "";
        data.forEach(p => {
            const card = document.createElement('div');
            card.className = 'p-card';
            card.onclick = () => openDescription(p.id);
            card.innerHTML = `
                <img src="${p.images[0]}" onerror="this.src='Dkart.jpg'">
                <div style="font-weight:600; margin-top:10px;">${p.name}</div>
                <div style="color:var(--accent); font-weight:800;">₹${p.price}</div>
            `;
            list.appendChild(card);
        });
    }

    window.openDescription = (id) => {
        currentProduct = allProducts.find(p => p.id === id);
        selectedSize = null;
        const cont = document.getElementById('desc-content');
        let sizes = currentProduct.sizes ? currentProduct.sizes.map(s => `<div class="s-box" onclick="selectS(this, '${s}')">${s}</div>`).join('') : '';

        cont.innerHTML = `
            <img src="${currentProduct.images[0]}" class="desc-img">
            <div class="desc-title">${currentProduct.name}</div>
            <div style="font-size:24px; font-weight:900; color:var(--accent);">₹${currentProduct.price}</div>
            <p class="desc-text">${currentProduct.description || 'No description available.'}</p>
            <div style="margin-bottom:10px; font-weight:bold;">CHOOSE SIZE:</div>
            <div class="size-list">${sizes || 'Free Size'}</div>
            <button class="action-btn" onclick="openCheckout()">BUY NOW</button>
        `;
        document.getElementById('desc-view').style.display = 'block';
    };

    window.selectS = (el, s) => {
        document.querySelectorAll('.s-box').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        selectedSize = s;
    };

    window.openCheckout = () => {
        if(currentProduct.sizes && !selectedSize) return alert("Pehle Size chunein!");
        document.getElementById('order-item').innerText = `${currentProduct.name} (${selectedSize || 'Free'})`;
        document.getElementById('checkout-view').style.display = 'block';
    };

    document.getElementById('confirm-order-btn').onclick = async () => {
        const name = document.getElementById('c-name').value;
        const phone = document.getElementById('c-phone').value;
        const addr = document.getElementById('c-addr').value;

        if(!name || !phone || !addr) return alert("Puri jankari bharein!");

        await addDoc(collection(db, "orders"), {
            product: currentProduct.name,
            price: currentProduct.price,
            size: selectedSize || "Free",
            customer: name, phone, address: addr,
            time: serverTimestamp()
        });
        alert("Order Successful! ✅");
        location.reload();
    };

    window.closeView = (id) => document.getElementById(id).style.display = 'none';
    load();
</script>
</body>
</html>
