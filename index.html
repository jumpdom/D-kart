<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Premium Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #000000; --accent: #ffff00; --white: #ffffff; --bg: #0a0a0a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; color: var(--white); overflow-x: hidden; }
        
        header { background: var(--primary); padding: 15px 10px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 1000; text-align: center; }
        .brand { font-family: 'Montserrat', sans-serif; font-size: 26px; font-weight: 900; color: var(--accent); font-style: italic; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .p-card { background: #151515; padding: 10px; border-radius: 12px; border: 1.5px solid var(--white); }
        .p-card img { width: 100%; height: 120px; object-fit: contain; }

        .full-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 3000; display: none; overflow-y: auto; }
        .view-header { padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #333; background: var(--primary); position: sticky; top: 0; }
        .view-header span { color: var(--accent); font-weight: 700; margin-left: 15px; }

        .profile-card { background: #151515; padding: 25px; border-radius: 15px; border: 1px solid var(--accent); text-align: center; margin: 20px; }
        .profile-img-big { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
        
        .menu-item { background: #151515; margin: 10px 20px; padding: 15px; border-radius: 10px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: var(--accent); color: #000; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 800; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; border-top: 2px solid var(--accent); z-index: 2000; height: 65px; align-items: center; }
        .nav-tab { flex: 1; text-align: center; color: #777; font-size: 10px; font-weight: 700; cursor: pointer; }
        .nav-tab.active { color: var(--accent); }
        .nav-tab i { font-size: 20px; display: block; margin-bottom: 3px; }

        input { width: 100%; padding: 15px; margin-bottom: 10px; background: #111; color: white; border: 1px solid #333; border-radius: 8px; }
        .btn-main { width: 100%; padding: 15px; background: var(--accent); color: #000; font-weight: 900; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div id="home-sec">
    <header><span class="brand">DKART</span></header>
    <div class="grid" id="productList">
        <p style="text-align:center; grid-column: 1/3;">Loading Products...</p>
    </div>
</div>

<!-- Profile Section -->
<div id="profile-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="showTab('home')"></i><span>My Profile</span></div>
    
    <div id="profile-main-ui">
        <div class="profile-card">
            <img id="u-img" src="https://via.placeholder.com/90" class="profile-img-big">
            <h3 id="u-name" style="margin:10px 0 5px; color:var(--accent);">Guest</h3>
            <p id="u-phone" style="font-size:12px; color:#888;"></p>
            <button onclick="document.getElementById('profile-setup-form').style.display='block'; document.getElementById('profile-main-ui').style.display='none';" style="background:none; border:1px solid #444; color:#ccc; padding:5px 10px; border-radius:5px; font-size:10px;">Edit Profile</button>
        </div>

        <div class="menu-item"><span>❤️ My Wishlist</span><span class="badge">0</span></div>
        <div class="menu-item" onclick="verifyMe()"><span>📱 Mobile Verification</span><span id="v-status" style="color:red; font-size:11px;">Not Verified</span></div>
        
        <div style="text-align:center; margin-top:30px; font-size:12px; color:#555;">
            <p onclick="alert('Terms applied')">Terms & Conditions</p>
            <p onclick="alert('Demo shop')">Disclaimer</p>
            <button onclick="localStorage.removeItem('dk_user'); location.reload();" style="color:red; background:none; border:none; font-weight:bold; cursor:pointer;">LOGOUT</button>
        </div>
    </div>

    <!-- Setup Form -->
    <div id="profile-setup-form" style="display:none; padding:20px;">
        <h2 style="color:var(--accent);">Setup Profile</h2>
        <input type="text" id="in-name" placeholder="Full Name">
        <input type="tel" id="in-phone" placeholder="Phone Number">
        <input type="text" id="in-addr" placeholder="Address">
        <p style="font-size:12px;">Photo Select Karein:</p>
        <input type="file" id="in-photo" accept="image/*">
        <button class="btn-main" onclick="saveMyProfile()">SAVE PROFILE</button>
    </div>
</div>

<!-- Navigation -->
<nav class="nav-bar">
    <div class="nav-tab active" onclick="showTab('home')"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="nav-tab" onclick="showTab('orders')"><i class="fa-solid fa-bag-shopping"></i><span>Orders</span></div>
    <div class="nav-tab" onclick="showTab('profile')"><i class="fa-solid fa-user"></i><span>Profile</span></div>
</nav>

<script>
    // Global Functions (Taaki button pe click kaam kare)
    window.showTab = function(tab) {
        document.getElementById('profile-view').style.display = (tab === 'profile') ? 'block' : 'none';
        // Add more logic for orders tab here if needed
    }

    window.saveMyProfile = function() {
        const name = document.getElementById('in-name').value;
        const phone = document.getElementById('in-phone').value;
        const addr = document.getElementById('in-addr').value;
        const photoFile = document.getElementById('in-photo').files[0];

        if(!name || !phone) return alert("Details bhariye!");

        const reader = new FileReader();
        reader.onload = function(e) {
            const user = { name, phone, addr, photo: e.target.result, verified: false };
            localStorage.setItem('dk_user', JSON.stringify(user));
            location.reload(); // Data save hone ke baad reload
        };

        if(photoFile) reader.readAsDataURL(photoFile);
        else {
            const user = { name, phone, addr, photo: 'https://via.placeholder.com/90', verified: false };
            localStorage.setItem('dk_user', JSON.stringify(user));
            location.reload();
        }
    }

    window.verifyMe = function() {
        const user = JSON.parse(localStorage.getItem('dk_user'));
        if(!user) return alert("Pehle profile banayein!");
        let code = prompt("OTP Dalein (1234):");
        if(code === "1234") {
            user.verified = true;
            localStorage.setItem('dk_user', JSON.stringify(user));
            location.reload();
        }
    }

    // Check User on Load
    window.onload = function() {
        const user = JSON.parse(localStorage.getItem('dk_user'));
        if(user) {
            document.getElementById('u-name').innerText = user.name;
            document.getElementById('u-phone').innerText = "+91 " + user.phone;
            document.getElementById('u-img').src = user.photo;
            if(user.verified) {
                document.getElementById('v-status').innerText = "✅ Verified";
                document.getElementById('v-status').style.color = "green";
            }
        }
    };
</script>

<script type="module">
    // Firebase Logic (Products dikhane ke liye)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function getProducts() {
        const snap = await getDocs(collection(db, "products"));
        const list = document.getElementById('productList');
        list.innerHTML = "";
        snap.forEach(doc => {
            const p = doc.data();
            list.innerHTML += `
                <div class="p-card">
                    <img src="${p.images ? p.images[0] : 'https://via.placeholder.com/120'}">
                    <div style="color:yellow; font-size:12px; margin-top:5px;">${p.name}</div>
                    <div style="font-weight:bold;">₹${p.price}</div>
                </div>
            `;
        });
    }
    getProducts();
</script>

</body>
</html>
