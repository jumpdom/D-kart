<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dkart | Shop Now</title>
    <style>
        /* CSS YAHI PAR HAI */
        body { margin: 0; font-family: sans-serif; background: #f1f3f6; }
        .navbar { background: #2874f0; color: white; padding: 10px; position: sticky; top: 0; z-index: 100; }
        .nav-top { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: auto; }
        .logo { font-size: 22px; font-weight: bold; cursor: pointer; }
        .container { max-width: 1200px; margin: 20px auto; padding: 10px; }
        .product-card { background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-card img { width: 100%; max-height: 200px; object-fit: contain; }
        .p-price { font-size: 20px; font-weight: bold; color: #388e3c; margin: 10px 0; }
        .btn-buy { background: #fb641b; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 16px; }
        
        /* Modal Popup */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: white; width: 90%; max-width: 350px; margin: 20% auto; padding: 20px; border-radius: 8px; }
        .modal-content input, .modal-content textarea { width: 100%; margin-bottom: 10px; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .confirm-btn { background: #28a745; color: white; border: none; width: 100%; padding: 15px; cursor: pointer; font-size: 16px; border-radius: 4px; }
        .close-btn { background: #eee; border: none; width: 100%; padding: 10px; margin-top: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-top">
            <div class="logo">Dkart</div>
            <div style="font-size: 20px;">🛒 <span id="cart-count">0</span></div>
        </div>
    </header>

    <main class="container">
        <div class="product-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_6uP77_k8W1z0vj_k67eBvA0u6p7B6X3x9A&s" alt="Shirt">
            <h4>Premium Cotton Shirt</h4>
            <p class="p-price">₹599</p>
            <button class="btn-buy" onclick="openOrderForm('Premium Cotton Shirt', '599')">BUY NOW</button>
        </div>
    </main>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0;">Order Details</h3>
            <p id="item-info" style="color: #2874f0; font-weight: bold;"></p>
            <input type="text" id="custName" placeholder="Aapka Naam">
            <input type="number" id="custPhone" placeholder="WhatsApp Number">
            <textarea id="custAddress" placeholder="Pura Address aur Pin Code" rows="3"></textarea>
            <button class="confirm-btn" onclick="sendOrder()">Confirm Order</button>
            <button class="close-btn" onclick="closeForm()">Cancel</button>
        </div>
    </div>

    <script>
        let selectedItem = "";
        let selectedPrice = "";

        function openOrderForm(name, price) {
            // Debugging ke liye alert
            console.log("Opening form for: " + name);
            selectedItem = name;
            selectedPrice = price;
            document.getElementById('item-info').innerText = name + " - ₹" + price;
            document.getElementById('orderModal').style.display = "block";
        }

        function closeForm() {
            document.getElementById('orderModal').style.display = "none";
        }

        function sendOrder() {
            let name = document.getElementById('custName').value;
            let phone = document.getElementById('custPhone').value;
            let address = document.getElementById('custAddress').value;

            if(name == "" || phone == "" || address == "") {
                alert("Kripya saari details bhariye!");
                return;
            }

            let myWhatsApp = "918521684137";
            let msg = `*Dkart New Order*%0A*Item:* ${selectedItem}%0A*Price:* ₹${selectedPrice}%0A%0A*Name:* ${name}%0A*Mob:* ${phone}%0A*Address:* ${address}`;
            
            let finalUrl = "https://api.whatsapp.com/send?phone=" + myWhatsApp + "&text=" + msg;
            
            window.open(finalUrl, '_blank');
            closeForm();
        }
    </script>
</body>
</html>
