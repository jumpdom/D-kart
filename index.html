<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Premium Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #000000; --accent: #ffff00; --white: #ffffff; --bg: #0a0a0a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; color: var(--white); }

        /* Header & Search */
        header { background: var(--primary); padding: 15px 10px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 1000; }
        .logo-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
        .logo-img { width: 35px; height: 35px; border-radius: 5px; border: 1px solid var(--white); }
        .brand { font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 900; color: var(--accent); font-style: italic; }
        
        .search-container { padding: 0 10px; }
        .search-box { background: #222; border-radius: 8px; display: flex; align-items: center; padding: 10px 15px; border: 1px solid #444; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; font-size: 14px; }

        /* Categories */
        .cat-row { display: flex; overflow-x: auto; padding: 15px 10px; gap: 15px; scrollbar-width: none; background: #111; border-bottom: 1px solid #222; }
        .cat-row::-webkit-scrollbar { display: none; }
        .cat-item { min-width: 75px; text-align: center; }
        .cat-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 20px; color: #000; border: 2px solid #fff; }
        .cat-item span { font-size: 10px; font-weight: 700; color: #fff; text-transform: uppercase; }

        /* Product Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .p-card { background: #181818; padding: 10px; border-radius: 12px; border: 1.5px solid var(--white); box-shadow: 0 5px 15px rgba(0,0,0,0.8); cursor: pointer; }
        .p-card img { width: 100%; height: 140px; object-fit: contain; border-radius: 8px; background: #222; }
        .p-name { font-size: 12px; font-weight: 600; color: var(--accent); margin-top: 10px; height: 35px; overflow: hidden; text-transform: uppercase; }
        .p-price { font-size: 17px; font-weight: 800; color: var(--white); margin: 5px 0; }

        /* Bottom Navigation Bar Fix */
        .nav-bar { 
            position: fixed; bottom: 0; width: 100%; background: #000; 
            display: flex; border-top: 2px solid var(--accent); z-index: 3000; 
            height: 65px; align-items: center; justify-content: space-around;
        }
        .nav-tab { text-align: center; color: #777; transition: 0.3s; cursor: pointer; flex: 1; }
        .nav-tab i { font-size: 20px; display: block; margin-bottom: 4px; }
        .nav-tab span { font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .nav-tab.active { color: var(--accent); }

        /* Views */
        .full-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 4000; display: none; overflow-y: auto; }
        .view-header { padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #333; background: var(--primary); }
        .view-header span { color: var(--accent); font-weight: 700; margin-left: 15px; }

        .btn-box { position: fixed; bottom: 0; width: 100%; display: flex; height: 60px; z-index: 4500; }
        .btn-main { flex: 1; border: none; font-weight: 900; font-size: 18px; background: var(--accent); color: black; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="home-sec">
    <header>
        <div class="logo-row">
            <img src="Dkart.jpg" class="logo-img">
            <span class="brand">DKART</span>
        </div>
        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color: #ffff00;"></i>
                <input type="text" id="searchInput" placeholder="Search for products..." onkeyup="searchFun()">
            </div>
        </div>
    </header>

    <div class="cat-row">
        <div class="cat-item" onclick="filterCat('All')"><div class="cat-icon" style="background: #FFD700;"><i class="fa-solid fa-grip"></i></div><span>All</span></div>
        <div class="cat-item" onclick="filterCat('Mobile')"><div class="cat-icon" style="background: #FF5733;"><i class="fa-solid fa-mobile-button"></i></div><span>Mobile</span></div>
        <div class="cat-item" onclick="filterCat('Fashion')"><div class="cat-icon" style="background: #C70039;"><i class="fa-solid fa-shirt"></i></div><span>Fashion</span></div>
        <div class="cat-item" onclick="filterCat('Gadgets')"><div class="cat-icon" style="background: #900C3F;"><i class="fa-solid fa-headphones"></i></div><span>Gadgets</span></div>
    </div>

    <div class="grid" id="productList"></div>
</div>

<!-- Details & Checkout Views (Same as before) -->
<div id="detail-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="closeAll()"></i><span>PRODUCT VIEW</span></div>
    <div style="padding: 20px; text-align: center;">
        <img id="det-img" style="width: 100%; border-radius: 12px; border: 1px solid #333;">
        <h2 id="det-name" style="color: var(--accent); margin-top: 15px;"></h2>
        <div id="det-price" style="font-size: 26px; font-weight: 800;"></div>
    </div>
    <div class="btn-box"><button class="btn-main" onclick="openCheckout()">BUY NOW</button></div>
</div>

<div id="checkout-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="closeCheckout()"></i><span>CHECKOUT</span></div>
    <div style="padding: 20px;">
        <input type="text" id="c-name" placeholder="Name" style="width:100%; padding:15px; margin-bottom:10px; background:#1a1a1a; color:white; border:1px solid #444; border-radius:8px;">
        <input type="tel" id="c-phone" placeholder="Phone" style="width:100%; padding:15px; margin-bottom:10px; background:#1a1a1a; color:white; border:1px solid #444; border-radius:8px;">
        <textarea id="c-addr" placeholder="Address" style="width:100%; padding:15px; background:#1a1a1a; color:white; border:1px solid #444; border-radius:8px;" rows="3"></textarea>
    </div>
    <div class="btn-box"><button class="btn-main" id="order-btn">CONFIRM ORDER</button></div>
</div>

<!-- New Bottom Navigation Bar -->
<nav class="nav-bar">
    <div class="nav-tab active" onclick="location.reload()">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </div>
    <div class="nav-tab" onclick="alert('My Orders section coming soon!')">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>My Orders</span>
    </div>
    <div class="nav-tab" onclick="alert('Wishlist section coming soon!')">
        <i class="fa-solid fa-heart"></i>
        <span>Wishlist</span>
    </div>
    <div class="nav-tab" onclick="alert('Profile section coming soon!')">
        <i class="fa-solid fa-user"></i>
        <span>Account</span>
    </div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allP = [];
    let currentP = null;

    async function load() {
        const q = query(collection(db, "products"), orderBy("time", "desc"));
        const snap = await getDocs(q);
        allP = snap.docs.map(d => ({...d.data()}));
        render(allP);
    }

    function render(data) {
        const list = document.getElementById('productList');
        list.innerHTML = "";
        data.forEach(p => {
            const card = document.createElement('div');
            card.className = 'p-card';
            card.innerHTML = `<img src="${p.images[0] || 'Dkart.jpg'}"><div class="p-name">${p.name}</div><div class="p-price">₹${p.price}</div>`;
            card.onclick = () => {
                currentP = p;
                document.getElementById('det-img').src = p.images[0] || 'Dkart.jpg';
                document.getElementById('det-name').innerText = p.name;
                document.getElementById('det-price').innerText = "₹" + p.price;
                document.getElementById('detail-view').style.display = 'block';
            };
            list.appendChild(card);
        });
    }

    window.searchFun = () => {
        const val = document.getElementById('searchInput').value.toLowerCase();
        render(allP.filter(p => p.name.toLowerCase().includes(val)));
    };

    window.closeAll = () => document.getElementById('detail-view').style.display = 'none';
    window.openCheckout = () => document.getElementById('checkout-view').style.display = 'block';
    window.closeCheckout = () => document.getElementById('checkout-view').style.display = 'none';

    document.getElementById('order-btn').onclick = async () => {
        const n = document.getElementById('c-name').value;
        const ph = document.getElementById('c-phone').value;
        const ad = document.getElementById('c-addr').value;
        if(!n || !ph || !ad) return alert("Details bhariye!");
        
        await addDoc(collection(db, "orders"), {
            productName: currentP.name, price: currentP.price,
            customerName: n, customerPhone: ph, address: ad,
            status: "Pending", orderTime: serverTimestamp()
        });
        alert("Order Success! ✅");
        location.reload();
    };

    load();
</script>
</body>
</html>
