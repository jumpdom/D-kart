<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dkart | Online Shopping</title>
    <style>
        :root { --primary: #2874f0; --secondary: #fb641b; }
        body { font-family: Arial, sans-serif; background: #f1f3f6; margin: 0; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; italic; }
        .search-box { padding: 10px; background: var(--primary); display: flex; justify-content: center; }
        #search { width: 90%; padding: 10px; border-radius: 4px; border: none; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .img-box { width: 100%; height: 180px; background: #fff; display: flex; align-items: center; justify-content: center; }
        .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .info { padding: 10px; flex-grow: 1; }
        .p-name { font-size: 14px; margin-bottom: 5px; height: 35px; overflow: hidden; }
        .p-price { font-size: 18px; font-weight: bold; }
        .buy-btn { background: var(--secondary); color: white; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>Dkart</header>
<div class="search-box"><input type="text" id="search" placeholder="Search products..."></div>

<div class="container" id="productList"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      storageBucket: "dkart-87860.firebasestorage.app",
      messagingSenderId: "894407834952",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadProducts() {
        const list = document.getElementById('productList');
        const q = query(collection(db, "products"), orderBy("time", "desc"));
        const querySnapshot = await getDocs(q);
        list.innerHTML = "";

        querySnapshot.forEach((doc) => {
            const data = doc.data();
            
            // PHOTO FIX: Naye array aur purane link dono ko check karega
            let finalImg = "https://via.placeholder.com/200";
            if (data.images && data.images.length > 0) {
                finalImg = data.images[0]; 
            } else if (data.imgUrl) {
                finalImg = data.imgUrl;
            }

            list.innerHTML += `
                <div class="card">
                    <div class="img-box"><img src="${finalImg}"></div>
                    <div class="info">
                        <div class="p-name">${data.name}</div>
                        <div class="p-price">₹${data.price}</div>
                        <div style="font-size:11px; color:gray;">${data.details || ''}</div>
                    </div>
                    <button class="buy-btn">BUY NOW</button>
                </div>`;
        });
    }
    loadProducts();
</script>
</body>
</html>
