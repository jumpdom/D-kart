<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Premium Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2874f0; --bg: #f1f3f6; --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 70px; }

        /* Header & Search */
        header { background: var(--primary); color: white; padding: 10px 15px; position: sticky; top: 0; z-index: 1000; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .logo-box { display: flex; align-items: center; gap: 8px; }
        .logo-img { width: 30px; height: 30px; border-radius: 4px; object-fit: cover; }
        .brand { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 900; font-style: italic; }
        .search-container { background: var(--white); border-radius: 4px; display: flex; align-items: center; padding: 8px 12px; }
        .search-container input { border: none; width: 100%; margin-left: 10px; outline: none; font-size: 14px; }

        /* Categories */
        .cat-row { display: flex; overflow-x: auto; background: var(--white); padding: 10px; gap: 20px; scrollbar-width: none; border-bottom: 1px solid #ddd; }
        .cat-item { text-align: center; min-width: 65px; cursor: pointer; }
        .cat-item img { width: 45px; height: 45px; object-fit: contain; }
        .cat-item span { display: block; font-size: 11px; font-weight: 600; margin-top: 5px; }

        /* Product Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
        .p-card { background: var(--white); padding: 10px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); cursor: pointer; }
        .p-card img { width: 100%; height: 140px; object-fit: contain; }
        .p-name { font-size: 13px; height: 36px; overflow: hidden; margin-top: 8px; color: #212121; }
        .p-price { font-weight: 800; font-size: 16px; margin: 5px 0; color: #000; }

        /* Section Handling */
        .section { display: none; min-height: 100vh; background: var(--bg); }
        .section.active { display: block; }

        /* Profile & Orders */
        .prof-header { background: var(--primary); color: white; padding: 25px 15px; }
        .menu-box { background: white; margin-top: -15px; border-radius: 15px 15px 0 0; padding: 10px 0; }
        .menu-link { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid #f0f0f0; font-weight: 600; color: #333; }
        .menu-link i { margin-right: 15px; color: var(--primary); width: 20px; }
        .order-card { background: white; margin: 10px; padding: 15px; border-radius: 8px; position: relative; }
        .cancel-btn { color: red; border: 1px solid red; background: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-top: 10px; cursor: pointer; }

        /* Navigation Bar */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; z-index: 1000; }
        .nav-tab { flex: 1; text-align: center; padding: 10px 0; color: #666; font-size: 10px; font-weight: 600; cursor: pointer; }
        .nav-tab.active { color: var(--primary); }
        .nav-tab i { font-size: 20px; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

<header id="main-header">
    <div class="top-bar">
        <div class="logo-box">
            <img src="Dkart.jpg" class="logo-img" alt="Logo">
            <span class="brand">Dkart</span>
        </div>
        <i class="fa-solid fa-cart-shopping" style="font-size: 18px;"></i>
    </div>
    <div class="search-container">
        <i class="fa-solid fa-magnifying-glass" style="color: #999;"></i>
        <input type="text" id="searchInput" placeholder="Search for products, brands and more" onkeyup="searchFn()">
    </div>
</header>

<!-- Home Section -->
<div id="home-sec" class="section active">
    <div class="cat-row">
        <div class="cat-item" onclick="filter('All')"><img src="https://cdn-icons-png.flaticon.com/512/1239/1239922.png"><span>All</span></div>
        <div class="cat-item" onclick="filter('Fashion')"><img src="https://cdn-icons-png.flaticon.com/512/3159/3159614.png"><span>Fashion</span></div>
        <div class="cat-item" onclick="filter('Mobiles')"><img src="https://cdn-icons-png.flaticon.com/512/644/644458.png"><span>Mobiles</span></div>
        <div class="cat-item" onclick="filter('Electronics')"><img src="https://cdn-icons-png.flaticon.com/512/3659/3659899.png"><span>Gadgets</span></div>
    </div>
    <div class="grid" id="productList"></div>
</div>

<!-- Profile Section -->
<div id="profile-sec" class="section">
    <div class="prof-header">
        <h2 style="margin:0;">Amit Das</h2>
        <p style="font-size: 13px; opacity: 0.9;">+91 9876543210</p>
    </div>
    <div class="menu-box">
        <div class="menu-link" onclick="showPage('orders-sec')"><i class="fa-solid fa-box"></i> My Orders</div>
        <div class="menu-link"><i class="fa-solid fa-heart"></i> My Wishlist</div>
        <div class="menu-link"><i class="fa-solid fa-headset"></i> Help Centre</div>
        <div class="menu-link" style="color: red;" onclick="location.reload()"><i class="fa-solid fa-power-off"></i> Logout</div>
    </div>
</div>

<!-- My Orders Section -->
<div id="orders-sec" class="section">
    <div style="background: white; padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #ddd;">
        <i class="fa-solid fa-arrow-left" onclick="showPage('profile-sec')" style="margin-right: 15px; font-size: 18px;"></i>
        <h3 style="margin:0;">My Orders</h3>
    </div>
    <div id="orderList"></div>
</div>

<!-- Bottom Nav -->
<nav class="nav-bar">
    <div class="nav-tab active" id="tab-home" onclick="showPage('home-sec', this)"><i class="fa-solid fa-house"></i>Home</div>
    <div class="nav-tab" id="tab-prof" onclick="showPage('profile-sec', this)"><i class="fa-solid fa-user-circle"></i>Account</div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allData = [];

    async function loadApp() {
        const q = query(collection(db, "products"), orderBy("time", "desc"));
        const snap = await getDocs(q);
        allData = snap.docs.map(d => ({id: d.id, ...d.data()}));
        render(allData);
    }

    function render(data) {
        const list = document.getElementById('productList');
        list.innerHTML = "";
        data.forEach(p => {
            list.innerHTML += `
                <div class="p-card">
                    <img src="${p.images[0] || 'Dkart.jpg'}">
                    <div class="p-name">${p.name}</div>
                    <div class="p-price">₹${p.price}</div>
                    <div style="font-size:11px; color:#388e3c; font-weight:700;">Free Delivery</div>
                </div>`;
        });
    }

    window.showPage = (id, el) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        
        // Header control
        document.getElementById('main-header').style.display = (id === 'home-sec') ? 'block' : 'none';
        
        if(el) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }
        if(id === 'orders-sec') fetchOrders();
    }

    window.fetchOrders = async () => {
        const oList = document.getElementById('orderList');
        oList.innerHTML = "<p style='text-align:center; padding:20px;'>Loading orders...</p>";
        const snap = await getDocs(collection(db, "orders"));
        oList.innerHTML = "";
        snap.forEach(d => {
            const o = d.data();
            oList.innerHTML += `
                <div class="order-card">
                    <div style="font-weight:700;">${o.product}</div>
                    <div style="font-size:12px; color:#666;">Status: <span style="color:${o.status==='Cancelled'?'red':'green'}">${o.status}</span></div>
                    <div style="font-weight:800; margin-top:5px;">₹${o.total}</div>
                    ${o.status !== 'Cancelled' ? `<button class="cancel-btn" onclick="cancelOrder('${d.id}')">Cancel Order</button>` : ''}
                </div>`;
        });
    }

    window.cancelOrder = async (id) => {
        if(confirm("Kya aap ye order cancel karna chahte hain?")) {
            await updateDoc(doc(db, "orders", id), { status: "Cancelled" });
            fetchOrders();
        }
    }

    window.searchFn = () => {
        const val = document.getElementById('searchInput').value.toLowerCase();
        render(allData.filter(p => p.name.toLowerCase().includes(val)));
    }

    window.filter = (cat) => {
        if(cat === 'All') render(allData);
        else render(allData.filter(p => p.category === cat));
    }

    loadApp();
</script>
</body>
</html>
