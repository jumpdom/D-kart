<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Premium Shopping</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #1a237e; --accent: #3d5afe; --bg: #f4f6f8; --card: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 85px; }

        /* Header & Search */
        header { background: var(--card); padding: 10px 15px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .logo-box { display: flex; align-items: center; gap: 8px; }
        .logo-img { width: 35px; height: 35px; border-radius: 8px; }
        .brand-name { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 900; color: var(--primary); text-transform: uppercase; }
        
        .search-box { background: #f0f2f5; border-radius: 12px; display: flex; align-items: center; padding: 8px 15px; }
        .search-box input { border: none; background: none; width: 100%; padding: 5px; font-family: inherit; }

        /* Cart Floating Icon */
        .cart-icon { position: relative; font-size: 20px; color: var(--primary); }
        .cart-count { position: absolute; top: -8px; right: -8px; background: #ff1744; color: white; font-size: 10px; padding: 2px 5px; border-radius: 50%; font-weight: 800; }

        /* Categories */
        .cat-container { padding: 15px; background: white; display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; }
        .cat-container::-webkit-scrollbar { display: none; }
        .cat-card { text-align: center; min-width: 60px; }
        .cat-circle { width: 50px; height: 50px; background: #f0f2f5; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 18px; margin-bottom: 5px; }
        .cat-card span { font-size: 11px; font-weight: 600; }

        /* Product Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .product-card { background: var(--card); border-radius: 18px; overflow: hidden; border: 1px solid #eee; position: relative; }
        .img-box { height: 130px; display: flex; align-items: center; justify-content: center; background: #fff; padding: 10px; }
        .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .p-info { padding: 10px; }
        .btn-cart { background: #f0f2f5; color: var(--primary); border: none; padding: 8px; border-radius: 8px; width: 100%; font-weight: 700; margin-bottom: 5px; font-size: 12px; }
        .btn-buy { background: var(--primary); color: #fff; border: none; padding: 8px; border-radius: 8px; width: 100%; font-weight: 700; font-size: 12px; }

        /* Sections */
        .section { display: none; }
        .section.active { display: block; }

        /* Profile Style */
        .prof-header { background: var(--primary); color: white; padding: 30px 20px; border-radius: 0 0 25px 25px; text-align: center; }
        .menu-list { background: white; margin: -20px 15px 15px; border-radius: 20px; padding: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .menu-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f9f9f9; font-weight: 600; cursor: pointer; color: #333; }
        .menu-item i { width: 35px; color: var(--primary); }

        /* Navigation */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; }
        .nav-tab { text-align: center; color: #999; font-size: 11px; font-weight: 600; flex: 1; }
        .nav-tab.active { color: var(--primary); }
        .nav-tab i { font-size: 22px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<header>
    <div class="top-row">
        <div class="logo-box">
            <img src="Dkart.jpg" class="logo-img">
            <span class="brand-name">Dkart</span>
        </div>
        <div class="cart-icon" onclick="alert('Cart coming soon!')">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count">0</span>
        </div>
    </div>
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="color:#aaa; margin-right:10px;"></i>
        <input type="text" placeholder="Search products..." onkeyup="searchProduct(this.value)">
    </div>
</header>

<div id="home-sec" class="section active">
    <div class="cat-container">
        <div class="cat-card" onclick="filterCat('All')"><div class="cat-circle"><i class="fa-solid fa-border-all"></i></div><span>All</span></div>
        <div class="cat-card" onclick="filterCat('Men')"><div class="cat-circle"><i class="fa-solid fa-user-tie"></i></div><span>Men</span></div>
        <div class="cat-card" onclick="filterCat('Women')"><div class="cat-circle"><i class="fa-solid fa-person-dress"></i></div><span>Women</span></div>
        <div class="cat-card" onclick="filterCat('Tech')"><div class="cat-circle"><i class="fa-solid fa-mobile-screen"></i></div><span>Tech</span></div>
    </div>
    <div class="grid" id="productList"></div>
</div>

<div id="order-sec" class="section">
    <h3 style="padding:15px 20px; margin:0;">Track Orders</h3>
    <div id="orderList" style="text-align:center; padding:50px; color:#999;">Login to see orders.</div>
</div>

<div id="profile-sec" class="section">
    <div id="prof-dashboard">
        <div class="prof-header">
            <h2 id="u-name" style="margin:0;">Guest</h2>
            <p id="u-phone" style="font-size:14px; opacity:0.8;"></p>
        </div>
        <div class="menu-list">
            <div class="menu-item" onclick="showPage('order-sec')"><i class="fa-solid fa-box-open"></i> My Orders</div>
            <div class="menu-item" onclick="alert('Wishlist is empty!')"><i class="fa-solid fa-heart"></i> My Wishlist</div>
            <div class="menu-item" onclick="alert('WhatsApp Help: 123456789')"><i class="fa-solid fa-headset"></i> Help & Support</div>
            <div class="menu-item" onclick="localStorage.removeItem('dk_user'); location.reload()"><i class="fa-solid fa-right-from-bracket" style="color:red;"></i> Logout</div>
        </div>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-tab active" onclick="showPage('home-sec', this)"><i class="fa-solid fa-house"></i>Home</div>
    <div class="nav-tab" onclick="showPage('order-sec', this)"><i class="fa-solid fa-box"></i>Orders</div>
    <div class="nav-tab" onclick="showPage('profile-sec', this)"><i class="fa-solid fa-user-circle"></i>Profile</div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      storageBucket: "dkart-87860.firebasestorage.app",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allItems = [];

    async function loadData() {
        const q = query(collection(db, "products"), orderBy("time", "desc"));
        const snap = await getDocs(q);
        allItems = snap.docs.map(d => ({id: d.id, ...d.data()}));
        render(allItems);
        checkUser();
    }

    function render(data) {
        const list = document.getElementById('productList');
        list.innerHTML = "";
        data.forEach(p => {
            list.innerHTML += `
                <div class="product-card">
                    <div class="img-box"><img src="${p.images[0] || 'Dkart.jpg'}"></div>
                    <div class="p-info">
                        <div style="font-size:12px; font-weight:600; height:35px; overflow:hidden;">${p.name}</div>
                        <div style="font-size:16px; font-weight:800; color:var(--primary); margin:5px 0;">₹${p.price}</div>
                        <button class="btn-cart" onclick="addToCart('${p.name}')">Add to Cart</button>
                        <button class="btn-buy" onclick="buyNow('${p.name}', ${p.price})">Buy Now</button>
                    </div>
                </div>`;
        });
    }

    window.searchProduct = (val) => {
        const filtered = allItems.filter(p => p.name.toLowerCase().includes(val.toLowerCase()));
        render(filtered);
    }

    window.filterCat = (cat) => {
        if(cat === 'All') render(allItems);
        else render(allItems.filter(p => p.category === cat));
    }

    window.addToCart = (name) => {
        alert(name + " added to cart! 🛒");
        let count = parseInt(document.querySelector('.cart-count').innerText);
        document.querySelector('.cart-count').innerText = count + 1;
    }

    window.buyNow = (name, price) => {
        const user = JSON.parse(localStorage.getItem('dk_user'));
        if(!user) { alert("Pehle Profile setup karein!"); showPage('profile-sec'); return; }
        // Simple Order Logic
        alert("Redirecting to payment for: " + name);
    }

    function checkUser() {
        const user = JSON.parse(localStorage.getItem('dk_user'));
        if(user) {
            document.getElementById('u-name').innerText = user.name;
            document.getElementById('u-phone').innerText = "+91 " + user.phone;
        }
    }

    window.showPage = (id, el) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }
    }

    loadData();
</script>
</body>
</html>
