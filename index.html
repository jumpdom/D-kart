<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Premium Shopping</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #1a237e; --accent: #3d5afe; --bg: #f4f6f8; --card: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 85px; }

        header { 
            background: var(--card); padding: 10px 15px; position: sticky; top: 0; z-index: 1000; 
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-img { width: 45px; height: 45px; border-radius: 10px; object-fit: cover; }
        .brand-name { font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 900; background: linear-gradient(45deg, #1a237e, #3d5afe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; line-height: 1; }
        .trust-tagline { font-size: 9px; font-weight: 700; color: #666; margin-top: 2px; text-transform: uppercase; }

        .section { display: none; }
        .section.active { display: block; }

        /* Product Cards */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .product-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid #eee; position: relative; }
        .img-box { height: 140px; padding: 15px; display: flex; align-items: center; justify-content: center; background: #fff; }
        .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .p-info { padding: 12px; }
        .p-price { font-size: 17px; font-weight: 800; color: var(--primary); margin: 5px 0; }
        .btn-buy { background: var(--primary); color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; }

        /* Checkout Page Styles */
        .checkout-box { background: white; margin: 15px; padding: 20px; border-radius: 25px; border: 1px solid #eee; }
        .order-summary { background: #f8faff; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px dashed var(--accent); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 11px; font-weight: 800; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1.5px solid #eee; border-radius: 12px; font-family: inherit; }
        
        .cod-badge { background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 10px; border: 1px solid #c8e6c9; }

        /* Navigation */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; }
        .nav-tab { text-align: center; color: #999; font-size: 11px; font-weight: 600; flex: 1; }
        .nav-tab.active { color: var(--primary); }
        .nav-tab i { font-size: 22px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<header>
    <div class="logo-box">
        <img src="Dkart.jpg" alt="Logo" class="logo-img">
        <div>
            <div class="brand-name">Dkart</div>
            <div class="trust-tagline">Quality • Trust • Fast Delivery</div>
        </div>
    </div>
</header>

<!-- Home -->
<div id="home-sec" class="section active">
    <div class="grid" id="productList"></div>
</div>

<!-- Checkout Page -->
<div id="checkout-sec" class="section">
    <div class="checkout-box">
        <h2 style="font-weight: 800; margin-top: 0;">Checkout</h2>
        
        <div class="order-summary">
            <p id="item-name" style="margin:0; font-weight:700; color:var(--primary);"></p>
            <p id="item-price" style="margin:5px 0 0; font-weight:800; font-size:18px;"></p>
        </div>

        <div class="form-group">
            <label>Quantity</label>
            <select id="order-qty" onchange="updateTotal()">
                <option value="1">1 Qty</option>
                <option value="2">2 Qty</option>
                <option value="3">3 Qty</option>
                <option value="5">5 Qty</option>
            </select>
        </div>

        <div class="form-group">
            <label>Delivery Address</label>
            <textarea id="order-addr" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="order-phone">
        </div>

        <div class="form-group">
            <label>Payment Mode</label>
            <div class="cod-badge">
                <i class="fa-solid fa-hand-holding-dollar"></i>
                Cash on Delivery (COD) Only
            </div>
        </div>

        <div style="margin: 20px 0; border-top: 1px solid #eee; padding-top: 15px;">
            <div style="display:flex; justify-content:space-between; font-weight:800; font-size:18px;">
                <span>Total Amount:</span>
                <span id="total-amt">₹0</span>
            </div>
        </div>

        <button class="btn-buy" style="padding:15px; font-size:16px;" onclick="confirmFinalOrder()">Confirm Order</button>
        <p onclick="showPage('home-sec')" style="text-align:center; color:#888; font-size:13px; margin-top:15px; cursor:pointer;">Cancel & Go Back</p>
    </div>
</div>

<!-- Profile -->
<div id="profile-sec" class="section">
    <!-- Existing profile code remains same -->
    <div id="login-form" style="padding:20px;">
        <button class="btn-buy" onclick="localStorage.removeItem('dk_user'); location.reload();">Reset Profile</button>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-tab active" id="tab-home" onclick="showPage('home-sec', this)"><i class="fa-solid fa-store"></i>Shop</div>
    <div class="nav-tab" id="tab-profile" onclick="showPage('profile-sec', this)"><i class="fa-solid fa-user-circle"></i>Profile</div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      storageBucket: "dkart-87860.firebasestorage.app",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let currentItem = null;
    let basePrice = 0;

    async function loadData() {
        const q = query(collection(db, "products"), orderBy("time", "desc"));
        const snap = await getDocs(q);
        const list = document.getElementById('productList');
        list.innerHTML = "";
        snap.forEach(doc => {
            const p = doc.data();
            list.innerHTML += `
                <div class="product-card">
                    <div class="img-box"><img src="${p.images[0] || 'Dkart.jpg'}"></div>
                    <div class="p-info">
                        <div class="p-title">${p.name}</div>
                        <div class="p-price">₹${p.price}</div>
                        <button class="btn-buy" onclick="openCheckout('${p.name}', ${p.price})">Buy Now</button>
                    </div>
                </div>`;
        });
    }

    window.openCheckout = (name, price) => {
        const user = JSON.parse(localStorage.getItem('dk_user'));
        if(!user) { alert("Pehle Profile setup karein!"); return; }

        currentItem = name;
        basePrice = price;
        
        document.getElementById('item-name').innerText = name;
        document.getElementById('item-price').innerText = "₹" + price;
        document.getElementById('order-addr').value = `${user.address}, ${user.state} - ${user.pin}`;
        document.getElementById('order-phone').value = user.phone;
        
        updateTotal();
        showPage('checkout-sec');
    }

    window.updateTotal = () => {
        const qty = document.getElementById('order-qty').value;
        const total = basePrice * qty;
        document.getElementById('total-amt').innerText = "₹" + total;
    }

    window.confirmFinalOrder = async () => {
        const qty = document.getElementById('order-qty').value;
        const addr = document.getElementById('order-addr').value;
        const phone = document.getElementById('order-phone').value;
        const total = basePrice * qty;

        if(!addr || !phone) return alert("Address aur Phone zaroori hai!");

        try {
            await addDoc(collection(db, "orders"), {
                productName: currentItem,
                price: basePrice,
                quantity: qty,
                totalAmount: total,
                customerPhone: phone,
                customerAddress: addr,
                paymentMode: "Cash on Delivery",
                status: "Pending",
                orderDate: serverTimestamp()
            });
            alert("Order Confirmed! Dhananyawad. ✅");
            showPage('home-sec');
        } catch(e) { alert("Order failed."); }
    }

    window.showPage = (id, el) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }
    }

    loadData();
</script>
</body>
</html>
