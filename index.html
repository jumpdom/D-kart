<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | My Orders</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #1a237e; --accent: #3d5afe; --bg: #f4f6f8; --card: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 85px; }

        header { background: var(--card); padding: 10px 15px; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
        .brand-name { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 900; background: linear-gradient(45deg, #1a237e, #3d5afe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }

        .section { display: none; }
        .section.active { display: block; }

        /* Product Cards */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .product-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid #eee; }
        .img-box { height: 130px; display: flex; align-items: center; justify-content: center; background: #fff; }
        .img-box img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .p-info { padding: 10px; }
        .btn-buy { background: var(--primary); color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; }

        /* My Orders Style */
        .order-item { background: white; margin: 10px 15px; padding: 15px; border-radius: 18px; border: 1px solid #eee; }
        .status-badge { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
        .status-Pending { background: #fff3e0; color: #ef6c00; }
        .status-Cancelled { background: #ffebee; color: #c62828; }
        .status-Delivered { background: #e8f5e9; color: #2e7d32; }
        .cancel-btn { background: none; border: 1px solid #ff1744; color: #ff1744; padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }

        /* Navigation */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; z-index: 1000; }
        .nav-tab { text-align: center; color: #999; font-size: 11px; font-weight: 600; flex: 1; cursor: pointer; }
        .nav-tab.active { color: var(--primary); }
        .nav-tab i { font-size: 22px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<header>
    <div class="logo-box">
        <img src="Dkart.jpg" alt="Logo" class="logo-img">
        <div class="brand-name">Dkart</div>
    </div>
</header>

<!-- Home -->
<div id="home-sec" class="section active">
    <div class="grid" id="productList"></div>
</div>

<!-- My Orders Section -->
<div id="orders-sec" class="section">
    <h3 style="padding: 15px 20px; margin: 0; font-weight: 800;">My Orders</h3>
    <div id="orderList">
        <p style="text-align:center; padding:50px; color:#999;">No orders found.</p>
    </div>
</div>

<!-- Profile / Setup -->
<div id="profile-sec" class="section">
    <div id="profile-content"></div>
</div>

<nav class="nav-bar">
    <div class="nav-tab active" onclick="showPage('home-sec', this)"><i class="fa-solid fa-store"></i>Shop</div>
    <div class="nav-tab" onclick="fetchOrders()"><i class="fa-solid fa-box"></i>Orders</div>
    <div class="nav-tab" onclick="showPage('profile-sec', this)"><i class="fa-solid fa-user-circle"></i>Profile</div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      storageBucket: "dkart-87860.firebasestorage.app",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadProducts() {
        const q = query(collection(db, "products"), orderBy("time", "desc"));
        const snap = await getDocs(q);
        const list = document.getElementById('productList');
        list.innerHTML = "";
        snap.forEach(d => {
            const p = d.data();
            list.innerHTML += `
                <div class="product-card">
                    <div class="img-box"><img src="${p.images[0] || 'Dkart.jpg'}"></div>
                    <div class="p-info">
                        <div style="font-size:12px; font-weight:600; height:35px; overflow:hidden;">${p.name}</div>
                        <div style="font-size:16px; font-weight:800; color:var(--primary); margin:5px 0;">₹${p.price}</div>
                        <button class="btn-buy" onclick="createOrder('${p.name}', ${p.price})">Buy Now</button>
                    </div>
                </div>`;
        });
    }

    window.createOrder = async (name, price) => {
        const user = JSON.parse(localStorage.getItem('dk_user'));
        if(!user) { alert("Pehle Profile setup karein!"); return; }
        
        if(confirm(`Confirm order for ${name}?`)) {
            await addDoc(collection(db, "orders"), {
                customerPhone: user.phone,
                customerName: user.name,
                product: name,
                total: price,
                status: "Pending",
                time: serverTimestamp()
            });
            alert("Order Placed! ✅ Check 'Orders' tab.");
        }
    }

    window.fetchOrders = async () => {
        const user = JSON.parse(localStorage.getItem('dk_user'));
        const list = document.getElementById('orderList');
        showPage('orders-sec', document.querySelector('.nav-bar div:nth-child(2)'));
        
        if(!user) { list.innerHTML = "<p style='text-align:center; padding:50px;'>Please Login to see orders.</p>"; return; }

        list.innerHTML = "<p style='text-align:center; padding:50px;'>Loading orders...</p>";
        const q = query(collection(db, "orders"), where("customerPhone", "==", user.phone), orderBy("time", "desc"));
        const snap = await getDocs(q);
        
        list.innerHTML = snap.empty ? "<p style='text-align:center; padding:50px;'>No orders found.</p>" : "";
        snap.forEach(d => {
            const o = d.data();
            const orderId = d.id;
            list.innerHTML += `
                <div class="order-item">
                    <div style="display:flex; justify-content:space-between; align-items:start;">
                        <div>
                            <div style="font-weight:700; font-size:14px; color:#333;">${o.product}</div>
                            <div style="font-weight:800; color:var(--primary); margin:3px 0;">₹${o.total}</div>
                        </div>
                        <span class="status-badge status-${o.status}">${o.status}</span>
                    </div>
                    ${o.status === 'Pending' ? `<button class="cancel-btn" onclick="cancelOrder('${orderId}')">Cancel Order</button>` : ''}
                </div>`;
        });
    }

    window.cancelOrder = async (id) => {
        if(confirm("Bhai, kya aap sach mein order cancel karna chahte hain?")) {
            await updateDoc(doc(db, "orders", id), { status: "Cancelled" });
            fetchOrders();
        }
    }

    window.showPage = (id, el) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }
    }

    loadProducts();
</script>
</body>
</html>
