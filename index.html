<!DOCTYPE html>
<html lang="hi">
<head>
    <link rel="icon" type="image/jpeg" href="IMG_6363.jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Premium Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #000; --accent: #ffff00; --white: #fff; --bg: #0a0a0a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; color: var(--white); }
        
        header { background: var(--primary); padding: 15px 10px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 1000; }
        .logo-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .logo-img { width: 45px; height: 45px; border-radius: 8px; border: 1.5px solid var(--white); object-fit: cover; }
        .brand { font-family: 'Montserrat', sans-serif; font-size: 28px; font-weight: 900; color: var(--accent); font-style: italic; }
        
        .header-action-row { display: flex; align-items: center; gap: 10px; }
        .search-box { flex: 1; background: #1a1a1a; border-radius: 8px; display: flex; align-items: center; padding: 10px 15px; border: 1px solid #333; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; outline: none; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .p-card { background: #111; padding: 12px; border-radius: 12px; border: 1.5px solid #333; }
        .p-card img { width: 100%; height: 140px; object-fit: contain; border-radius: 8px; background: #050505; }
        .p-name { font-size: 12px; font-weight: 600; color: #fff; margin: 10px 0 5px; height: 35px; overflow: hidden; text-transform: uppercase; }
        .p-price { font-size: 18px; font-weight: 800; color: var(--accent); }
        
        .size-list { display: flex; gap: 5px; overflow-x: auto; margin: 10px 0; scrollbar-width: none; }
        .s-box { min-width: 35px; height: 30px; border: 1px solid #444; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; cursor: pointer; }
        .s-box.selected { background: var(--accent); color: #000; border-color: #fff; }
        
        .buy-btn { width: 100%; background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 900; font-size: 13px; text-transform: uppercase; cursor: pointer; }

        .full-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 3000; display: none; overflow-y: auto; padding-bottom: 90px; }
        .view-header { padding: 15px; background: #000; display: flex; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; }
        .view-header span { margin-left: 15px; font-weight: 800; color: var(--accent); }

        .form-group { padding: 20px; }
        .form-group input, .form-group textarea { width: 100%; padding: 15px; margin-bottom: 10px; background: #111; color: white; border: 1px solid #333; border-radius: 8px; }
        
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; border-top: 2px solid var(--accent); height: 65px; align-items: center; z-index: 2000; }
        .nav-tab { flex: 1; text-align: center; color: #666; font-size: 10px; font-weight: 700; }
        .nav-tab.active { color: var(--accent); }
    </style>
</head>
<body>

<div id="home-sec">
    <header>
        <div class="logo-row">
            <img src="IMG_6363.jpeg" class="logo-img">
            <span class="brand">DKART</span>
        </div>
        <div class="header-action-row">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--accent)"></i>
                <input type="text" id="searchInput" placeholder="Search brands...">
            </div>
            <a href="https://wa.me/918521694137" style="color:#25D366; font-size:28px;"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
    </header>
    <div class="grid" id="productList"></div>
</div>

<!-- Checkout View -->
<div id="checkout-view" class="full-view">
    <div class="view-header"><i class="fa-solid fa-arrow-left" onclick="closeView('checkout-view')"></i><span>CONFIRM ORDER</span></div>
    <div class="form-group">
        <p id="order-summary" style="color:var(--accent); font-weight:bold; margin-bottom:20px;"></p>
        <input type="text" id="c-name" placeholder="Full Name">
        <input type="tel" id="c-phone" placeholder="Mobile Number">
        <textarea id="c-addr" placeholder="Full Address" rows="3"></textarea>
        <button class="buy-btn" id="confirm-order-btn">PLACE ORDER (COD)</button>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="nav-tab" onclick="alert('Profile Coming Soon')"><i class="fa-solid fa-user"></i><span>Profile</span></div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allProducts = [], selectedProduct = null, selectedSize = null;

    async function load() {
        const q = query(collection(db, "products"), orderBy("time", "desc"));
        const snap = await getDocs(q);
        allProducts = snap.docs.map(d => ({id: d.id, ...d.data()}));
        render(allProducts);
    }

    function render(data) {
        const list = document.getElementById('productList');
        list.innerHTML = "";
        data.forEach(p => {
            const card = document.createElement('div');
            card.className = 'p-card';
            
            let sizes = p.sizes ? p.sizes.map(s => `<div class="s-box" onclick="selectSize(this, '${s}')">${s}</div>`).join('') : '<div class="s-box selected">Free</div>';

            card.innerHTML = `
                <img src="${p.images[0]}" onerror="this.src='Dkart.jpg'">
                <div class="p-name">${p.name}</div>
                <div class="p-price">₹${p.price}</div>
                <div class="size-list">${sizes}</div>
                <button class="buy-btn" onclick="openCheckout('${p.id}')">BUY NOW</button>
            `;
            list.appendChild(card);
        });
    }

    window.selectSize = (el, size) => {
        const parent = el.parentElement;
        parent.querySelectorAll('.s-box').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        selectedSize = size;
    };

    window.openCheckout = (id) => {
        selectedProduct = allProducts.find(p => p.id === id);
        if(selectedProduct.sizes && !selectedSize) {
            alert("Please select a size first!");
            return;
        }
        document.getElementById('order-summary').innerText = `Buying: ${selectedProduct.name} (${selectedSize || 'Free Size'}) - ₹${selectedProduct.price}`;
        document.getElementById('checkout-view').style.display = 'block';
    };

    document.getElementById('confirm-order-btn').onclick = async () => {
        const name = document.getElementById('c-name').value;
        const phone = document.getElementById('c-phone').value;
        const addr = document.getElementById('c-addr').value;

        if(!name || !phone || !addr) return alert("Fill details!");

        try {
            await addDoc(collection(db, "orders"), {
                product: selectedProduct.name,
                price: selectedProduct.price,
                size: selectedSize || "Free",
                customer: name,
                phone: phone,
                address: addr,
                status: "Pending",
                time: serverTimestamp()
            });
            alert("Order Placed! ✅");
            location.reload();
        } catch(e) { alert("Error!"); }
    };

    window.closeView = (id) => document.getElementById(id).style.display = 'none';
    
    document.getElementById('searchInput').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        render(allProducts.filter(p => p.name.toLowerCase().includes(val)));
    };

    load();
</script>
</body>
</html>
