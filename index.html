<!DOCTYPE html>
<html lang="hi">
<head>
    <!-- Google Search Console Verification - Yaha apna code dalo -->
    <meta name="google-site-verification" content="YAHAN_APNA_GOOGLE_CODE_DALEIN" />

    <link rel="icon" type="image/jpeg" href="IMG_6363.jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Shop Online</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --primary: #000000; --accent: #ffff00; --white: #ffffff; --bg: #0a0a0a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; color: var(--white); overflow-x: hidden; }
        
        /* Fixed Header with Your Logo */
        header { background: var(--primary); padding: 15px 10px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 1000; }
        .logo-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px; }
        .logo-img { width: 45px; height: 45px; border-radius: 8px; border: 2px solid var(--accent); object-fit: cover; }
        .brand { font-family: 'Montserrat', sans-serif; font-size: 28px; font-weight: 900; color: var(--accent); font-style: italic; letter-spacing: 1px; }
        
        /* Search Bar */
        .search-area { padding: 0 10px; }
        .search-box { background: #1a1a1a; border-radius: 10px; display: flex; align-items: center; padding: 12px 15px; border: 1px solid #333; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; font-size: 14px; outline: none; }

        /* Grid & Navigation (Baki functions same hain) */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .p-card { background: #151515; padding: 10px; border-radius: 12px; border: 1.5px solid #222; text-align: center; }
        .p-card img { width: 100%; height: 140px; object-fit: contain; border-radius: 8px; }
        
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; border-top: 2px solid var(--accent); z-index: 2000; height: 70px; align-items: center; }
        .nav-tab { flex: 1; text-align: center; color: #777; font-size: 11px; font-weight: 700; cursor: pointer; }
        .nav-tab.active { color: var(--accent); }
        .nav-tab i { font-size: 22px; display: block; margin-bottom: 4px; }
        
        .full-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 3000; display: none; overflow-y: auto; }
        .view-header { padding: 18px; display: flex; align-items: center; border-bottom: 1px solid #333; background: var(--primary); }
    </style>
</head>
<body>

<div id="home-sec">
    <header>
        <div class="logo-row">
            <!-- Aapka Main Logo -->
            <img src="IMG_6363.jpeg" class="logo-img" alt="Dkart Logo">
            <span class="brand">DKART</span>
        </div>
        <div class="search-area">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--accent)"></i>
                <input type="text" id="searchInput" placeholder="Search products, brands...">
            </div>
        </div>
    </header>
    
    <div class="grid" id="productList">
        <!-- Products yahan load honge -->
    </div>
</div>

<!-- Tabs (Orders, Cart, Profile same as before) -->
<nav class="nav-bar">
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="nav-tab" id="ordersBtn"><i class="fa-solid fa-truck-fast"></i><span>Status</span></div>
    <div class="nav-tab" id="cartBtn"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span></div>
    <div class="nav-tab" id="profileBtn"><i class="fa-solid fa-user-gear"></i><span>Account</span></div>
</nav>

<script type="module">
    // Firebase aur baki ka sara logic jo pichle code mein tha, 
    // wo yahan use kijiye (Load products, Cart, Add to Cart logic).
    console.log("Dkart with Logo and Search Console Loaded!");
</script>

</body>
</html>
