<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Premium Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #000000; --accent: #ffff00; --white: #ffffff; --bg: #0a0a0a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; color: var(--white); }

        /* Header & Logo Section */
        header { background: var(--primary); padding: 15px 10px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 1000; }
        .logo-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px; }
        .logo-img { width: 45px; height: 45px; border-radius: 8px; border: 1.5px solid var(--white); object-fit: cover; }
        .brand { font-family: 'Montserrat', sans-serif; font-size: 26px; font-weight: 900; color: var(--accent); font-style: italic; letter-spacing: 1px; }
        
        .trust-tagline { font-size: 10px; color: var(--accent); font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

        /* Search Bar */
        .search-container { padding: 0 10px; }
        .search-box { background: #1a1a1a; border-radius: 10px; display: flex; align-items: center; padding: 10px 15px; border: 1px solid #333; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; font-size: 14px; }

        /* Colourful Horizontal Categories */
        .cat-row { display: flex; overflow-x: auto; padding: 15px 10px; gap: 15px; scrollbar-width: none; background: #111; border-bottom: 1px solid #222; }
        .cat-row::-webkit-scrollbar { display: none; }
        .cat-item { min-width: 70px; text-align: center; cursor: pointer; }
        .cat-icon { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 22px; color: #000; border: 2px solid #fff; transition: 0.3s; }
        .cat-item span { font-size: 10px; font-weight: 700; color: #fff; text-transform: uppercase; }
        .cat-item:active .cat-icon { transform: scale(0.9); }

        /* Product Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .p-card { background: #151515; padding: 10px; border-radius: 12px; border: 1.5px solid var(--white); position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .p-card img { width: 100%; height: 140px; object-fit: contain; background: #222; border-radius: 8px; }
        .p-name { font-size: 12px; font-weight: 600; color: var(--accent); margin-top: 8px; height: 35px; overflow: hidden; }
        .p-price { font-size: 17px; font-weight: 800; color: var(--white); }

        /* Navigation Bar */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; border-top: 2px solid var(--accent); z-index: 3000; height: 65px; align-items: center; }
        .nav-tab { flex: 1; text-align: center; color: #777; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .nav-tab.active { color: var(--accent); }
        .nav-tab i { font-size: 20px; display: block; margin-bottom: 3px; }

        /* Views */
        .full-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 4000; display: none; overflow-y: auto; }
        .view-header { padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #333; background: var(--primary); position: sticky; top: 0; }
        .view-header span { color: var(--accent); font-weight: 700; margin-left: 15px; }
    </style>
</head>
<body>

<div id="home-sec">
    <header>
        <!-- Logo aur Brand Name -->
        <div class="logo-row">
            <img src="Dkart.jpg" class="logo-img" alt="Dkart Logo">
            <span class="brand">DKART</span>
        </div>
        <div class="trust-tagline">
            <i class="fa-solid fa-shield-halved"></i> 100% Trusted Shopping • Secure Delivery
        </div>
        <!-- Search Bar -->
        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--accent)"></i>
                <input type="text" id="searchInput" placeholder="Search products..." onkeyup="searchFun()">
            </div>
        </div>
    </header>

    <!-- Colourful Categories Section -->
    <div class="cat-row">
        <div class="cat-item" onclick="filterCat('All')">
            <div class="cat-icon" style="background: #FFD700;"><i class="fa-solid fa-layer-group"></i></div>
            <span>All</span>
        </div>
        <div class="cat-item" onclick="filterCat('Mobile')">
            <div class="cat-icon" style="background: #FF4757;"><i class="fa-solid fa-mobile-screen-button"></i></div>
            <span>Mobile</span>
        </div>
        <div class="cat-item" onclick="filterCat('Fashion')">
            <div class="cat-icon" style="background: #2ED573;"><i class="fa-solid fa-shirt"></i></div>
            <span>Fashion</span>
        </div>
        <div class="cat-item" onclick="filterCat('Electronics')">
            <div class="cat-icon" style="background: #1E90FF;"><i class="fa-solid fa-plug"></i></div>
            <span>Gadgets</span>
        </div>
        <div class="cat-item" onclick="filterCat('Watch')">
            <div class="cat-icon" style="background: #FFA502;"><i class="fa-solid fa-stopwatch"></i></div>
            <span>Watch</span>
        </div>
    </div>

    <div class="grid" id="productList"></div>
</div>

<!-- Navigation Bar -->
<nav class="nav-bar">
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="nav-tab" onclick="alert('My Orders coming soon!')"><i class="fa-solid fa-bag-shopping"></i><span>My Orders</span></div>
    <div class="nav-tab" onclick="alert('Wishlist coming soon!')"><i class="fa-solid fa-heart"></i><span>Wishlist</span></div>
    <div class="nav-tab" onclick="alert('Account coming soon!')"><i class="fa-solid fa-user"></i><span>Account</span></div>
</nav>

<script type="module">
    // Firebase connection aur logic yahan aayega
    // (Pichle code wala same script use karein)
</script>

</body>
</html>
