<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dkart | Professional Shopping</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f1f3f6; }
        
        /* Navbar with Search */
        .navbar { background: #2874f0; color: white; padding: 10px; position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: auto; display: flex; flex-direction: column; gap: 10px; }
        .nav-top { display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 22px; font-weight: bold; font-style: italic; cursor: pointer; }
        
        /* Search Box Design */
        .search-area { display: flex; background: white; border-radius: 4px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .search-area input { border: none; padding: 10px; flex: 1; outline: none; font-size: 14px; }
        .search-area button { border: none; background: white; padding: 10px; color: #2874f0; cursor: pointer; font-size: 16px; }

        /* Categories */
        .category-bar { display: flex; background: white; overflow-x: auto; padding: 10px; gap: 10px; border-bottom: 1px solid #ddd; scrollbar-width: none; }
        .cat-btn { background: #f0f2f5; border: 1px solid #ddd; padding: 6px 15px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-size: 13px; }
        .cat-btn.active { background: #2874f0; color: white; border-color: #2874f0; }

        /* Products */
        .container { max-width: 1200px; margin: 10px auto; padding: 0 10px; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (min-width: 768px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }

        .product-card { background: white; border-radius: 4px; border: 1px solid #e0e0e0; display: flex; flex-direction: column; overflow: hidden; }
        .product-card img { width: 100%; height: 150px; object-fit: contain; padding: 10px; box-sizing: border-box; }
        .p-info { padding: 10px; flex-grow: 1; }
        .p-info h4 { margin: 5px 0; font-size: 14px; height: 35px; overflow: hidden; }
        .p-price { font-size: 16px; font-weight: bold; margin: 5px 0; }
        .btn-buy { background: #fb641b; color: white; border: none; padding: 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; border-radius: 2px; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: white; width: 85%; max-width: 380px; margin: 15vh auto; padding: 20px; border-radius: 8px; }
        .modal-content input, .modal-content textarea { width: 100%; margin-bottom: 10px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .confirm-btn { background: #388e3c; color: white; border: none; width: 100%; padding: 14px; font-weight: bold; cursor: pointer; border-radius: 4px; width: 100%; }
        .close-btn { background: #eee; border: none; width: 100%; padding: 10px; margin-top: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <div class="nav-top">
                <div class="logo" onclick="location.reload()">Dkart</div>
                <div style="font-size: 20px;">🛒</div>
            </div>
            <div class="search-area">
                <input type="text" id="myInput" onkeyup="searchProduct()" placeholder="Search for products (e.g. Shirt, Saree)">
                <button>🔍</button>
            </div>
        </div>
    </header>

    <nav class="category-bar">
        <button class="cat-btn active" onclick="filterCat('all', event)">All</button>
        <button class="cat-btn" onclick="filterCat('men', event)">Men</button>
        <button class="cat-btn" onclick="filterCat('women', event)">Women</button>
        <button class="cat-btn" onclick="filterCat('gadgets', event)">Gadgets</button>
    </nav>

    <main class="container">
        <div class="product-grid" id="product-list">
            <div class="product-card" data-cat="men">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_6uP77_k8W1z0vj_k67eBvA0u6p7B6X3x9A&s" alt="Shirt">
                <div class="p-info">
                    <h4>Premium Cotton Men Shirt</h4>
                    <p class="p-price">₹599</p>
                    <button class="btn-buy" onclick="openOrder('Premium Cotton Men Shirt', '599')">Buy Now</button>
                </div>
            </div>

            <div class="product-card" data-cat="women">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQW9q1A_m_N1_9I9S_A1_7C_K_W_F_H_N_I_G_A&s" alt="Saree">
                <div class="p-info">
                    <h4>Fancy Designer Saree</h4>
                    <p class="p-price">₹899</p>
                    <button class="btn-buy" onclick="openOrder('Fancy Designer Saree', '899')">Buy Now</button>
                </div>
            </div>
        </div>
    </main>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0">Order Details</h3>
            <p id="order-item" style="font-weight:bold; color:#2874f0"></p>
            <input type="text" id="userName" placeholder="Your Name">
            <input type="number" id="userPhone" placeholder="WhatsApp Number">
            <textarea id="userAddr" placeholder="Full Address" rows="3"></textarea>
            <button class="confirm-btn" onclick="finishOrder()">Confirm Order</button>
            <button class="close-btn" onclick="document.getElementById('orderModal').style.display='none'">Cancel</button>
        </div>
    </div>

    <script>
        let selectedP = "";
        let selectedPr = "";

        // Real-time Search Function
        function searchProduct() {
            let input = document.getElementById('myInput').value.toLowerCase();
            let cards = document.querySelectorAll('.product-card');
            
            cards.forEach(card => {
                let title = card.querySelector('h4').innerText.toLowerCase();
                if(title.includes(input)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        }

        // Category Filter
        function filterCat(cat, event) {
            let cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                if(cat === 'all' || card.getAttribute('data-cat') === cat) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function openOrder(n, p) {
            selectedP = n; selectedPr = p;
            document.getElementById('order-item').innerText = n + " - ₹" + p;
            document.getElementById('orderModal').style.display = "block";
        }

        function finishOrder() {
            let n = document.getElementById('userName').value;
            let ph = document.getElementById('userPhone').value;
            let ad = document.getElementById('userAddr').value;
            if(!n || !ph || !ad) { alert("Details bhariye!"); return; }

            let msg = `*Dkart Order*%0A*Item:* ${selectedP}%0A*Price:* ₹${selectedPr}%0A*Customer:* ${n}%0A*Address:* ${ad}`;
            window.open(`https://api.whatsapp.com/send?phone=918521684137&text=${msg}`, '_blank');
            document.getElementById('orderModal').style.display='none';
        }
    </script>
</body>
</html>
