<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dkart | Glowing Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Theme Colors */
        :root { 
            --primary-bg: #3d2b1f; /* Dark Brown */
            --card-bg: #4e3b2e;    /* Lighter Brown for Cards */
            --glow-blue: #00f2ff;  /* Light Blue for Glow */
            --text-color: #e0e0e0; 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Roboto', sans-serif; background: var(--primary-bg); margin: 0; padding-bottom: 80px; color: var(--text-color); overflow-x: hidden; }

        /* Stylish Header */
        header { background: #2d1e15; padding: 12px 15px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }
        .app-bar { display: flex; justify-content: space-between; align-items: center; }
        
        .logo-section { display: flex; align-items: center; gap: 8px; }
        .brand-logo { height: 34px; width: 34px; border-radius: 8px; border: 1.5px solid var(--glow-blue); box-shadow: 0 0 8px var(--glow-blue); }
        
        .brand-name { 
            font-family: 'Montserrat', sans-serif; 
            font-size: 22px; font-weight: 800; 
            color: var(--glow-blue); 
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.7), 0 0 20px rgba(0, 242, 255, 0.4);
        }

        /* Glowing Search */
        .search-area { background: #2d1e15; padding: 0 12px 12px 12px; }
        .search-input-box { 
            background: #4e3b2e; display: flex; align-items: center; padding: 10px 15px; border-radius: 8px; 
            border: 1px solid rgba(0, 242, 255, 0.3);
        }
        .search-input-box i { color: var(--glow-blue); margin-right: 10px; }
        .search-input-box input { border: none; outline: none; width: 100%; font-size: 14px; background: transparent; color: #fff; }

        /* Category Slider */
        .cat-scroll { display: flex; overflow-x: auto; padding: 15px 10px; gap: 15px; background: #2d1e15; margin-bottom: 8px; scrollbar-width: none; }
        .cat-item { text-align: center; min-width: 65px; cursor: pointer; }
        .cat-circle { 
            width: 48px; height: 48px; background: #4e3b2e; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; 
            color: var(--glow-blue); font-size: 18px; border: 1px solid rgba(0, 242, 255, 0.2);
            transition: 0.3s;
        }
        .cat-item span { font-size: 10px; color: #ccc; }
        .cat-item:hover .cat-circle { box-shadow: 0 0 10px var(--glow-blue); border-color: var(--glow-blue); }

        .section { display: none; }
        .section.active { display: block; }

        /* Products Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .product-card { 
            background: var(--card-bg); border-radius: 12px; overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); padding: 12px; 
            display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.05);
        }
        .img-container { 
            height: 140px; display: flex; align-items: center; justify-content: center; 
            margin-bottom: 10px; background: #fff; border-radius: 8px; padding: 5px;
        }
        .img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .p-title { font-size: 13px; font-weight: 500; height: 34px; overflow: hidden; color: #eee; margin-top: 5px; }
        .p-price { font-size: 16px; font-weight: bold; margin: 8px 0; color: var(--glow-blue); text-shadow: 0 0 5px rgba(0, 242, 255, 0.3); }
        
        /* Glowing Buttons */
        .btn-buy { 
            background: transparent; color: var(--glow-blue); border: 1.5px solid var(--glow-blue); 
            padding: 9px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; font-size: 11px; 
            text-transform: uppercase; box-shadow: 0 0 5px rgba(0, 242, 255, 0.2);
            transition: 0.3s;
        }
        .btn-buy:active { background: var(--glow-blue); color: #000; box-shadow: 0 0 15px var(--glow-blue); }
        
        .btn-cart { 
            background: rgba(255,255,255,0.05); color: #ccc; border: 1px solid rgba(255,255,255,0.1); 
            padding: 8px; border-radius: 6px; width: 100%; cursor: pointer; margin-top: 6px; font-size: 11px; 
        }

        /* Floating Navigation Bar */
        .nav-bar { 
            position: fixed; bottom: 0; width: 100%; background: #2d1e15; 
            display: flex; justify-content: space-around; padding: 12px 0; 
            border-top: 1px solid rgba(0, 242, 255, 0.1); z-index: 2000; 
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }
        .nav-tab { text-align: center; color: #888; text-decoration: none; font-size: 11px; width: 25%; cursor: pointer; transition: 0.3s; }
        .nav-tab i { font-size: 20px; display: block; margin-bottom: 4px; }
        .nav-tab.active { color: var(--glow-blue); text-shadow: 0 0 8px var(--glow-blue); }
    </style>
</head>
<body>

<header>
    <div class="app-bar">
        <div class="logo-section">
            <img src="Dkart.jpg" alt="Logo" class="brand-logo">
            <span class="brand-name">Dkart</span>
        </div>
        <i class="fas fa-shopping-cart" style="font-size: 19px; color: var(--glow-blue);"></i>
    </div>
</header>

<div class="search-area">
    <div class="search-input-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Saman search karein...">
    </div>
</div>

<div id="home-sec" class="section active">
    <div class="cat-scroll">
        <div class="cat-item" onclick="filterCat('All')"><div class="cat-circle"><i class="fas fa-border-all"></i></div><span>All</span></div>
        <div class="cat-item" onclick="filterCat('Men')"><div class="cat-circle"><i class="fas fa-tshirt"></i></div><span>Fashion</span></div>
        <div class="cat-item" onclick="filterCat('Mobiles')"><div class="cat-circle"><i class="fas fa-mobile-alt"></i></div><span>Mobiles</span></div>
        <div class="cat-item" onclick="filterCat('Gadgets')"><div class="cat-circle"><i class="fas fa-laptop"></i></div><span>Gadgets</span></div>
    </div>
    <div class="grid" id="productList"></div>
</div>

<div id="order-sec" class="section">
    <div style="padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <h3 style="margin:0; font-size: 16px; color: var(--glow-blue);"><i class="fas fa-shopping-bag"></i> My Saved Items</h3>
    </div>
    <div class="grid" id="cartList"></div>
</div>

<nav class="nav-bar">
    <div class="nav-tab active" id="homeTab" onclick="goHome(this)"><i class="fas fa-home"></i>Home</div>
    <div class="nav-tab" onclick="alert('Categories Coming Soon')"><i class="fas fa-th-large"></i>Cat</div>
    <div class="nav-tab" id="orderTab" onclick="showPage('order-sec', this)"><i class="fas fa-shopping-bag"></i>Orders</div>
    <div class="nav-tab" onclick="alert('Profile Loading...')"><i class="fas fa-user-circle"></i>Profile</div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAchWzhIxqmS7G0HPpvuq6WBwcr8pXzFAE",
      authDomain: "dkart-87860.firebaseapp.com",
      projectId: "dkart-87860",
      storageBucket: "dkart-87860.firebasestorage.app",
      messagingSenderId: "894407834952",
      appId: "1:894407834952:web:3067589b758c9819fe877d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allProducts = [];

    window.goHome = function(el) {
        document.getElementById('searchInput').value = "";
        showPage('home-sec', el);
        render(allProducts, 'productList');
    }

    window.showPage = function(id, el) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
        if(id === 'order-sec') displayCart();
    }

    async function fetchItems() {
        const q = query(collection(db, "products"), orderBy("time", "desc"));
        const snap = await getDocs(q);
        allProducts = snap.docs.map(doc => ({id: doc.id, ...doc.data()}));
        render(allProducts, 'productList');
    }

    function render(data, targetId) {
        const list = document.getElementById(targetId);
        list.innerHTML = data.length ? "" : "<p style='grid-column:1/3; text-align:center; padding:40px;'>No items found.</p>";
        
        data.forEach(p => {
            const img = (p.images && p.images.length > 0) ? p.images[0] : 'Dkart.jpg';
            list.innerHTML += `
                <div class="product-card">
                    <div class="img-container"><img src="${img}"></div>
                    <div class="p-title">${p.name}</div>
                    <div class="p-price">₹${p.price}</div>
                    <button class="btn-buy" onclick="alert('Proceeding to Buy ${p.name}')">Buy Now</button>
                    ${targetId === 'productList' ? `<button class="btn-cart" onclick="addToCart('${p.id}')">Add to Cart</button>` : ''}
                </div>`;
        });
    }

    window.filterCat = function(cat) {
        const filtered = (cat === 'All') ? allProducts : allProducts.filter(p => p.category === cat);
        render(filtered, 'productList');
    }

    window.addToCart = function(id) {
        let cart = JSON.parse(localStorage.getItem('dkart_cart') || '[]');
        if(!cart.includes(id)) {
            cart.push(id);
            localStorage.setItem('dkart_cart', JSON.stringify(cart));
            alert("Cart mein save ho gaya!");
        } else { alert("Already saved!"); }
    }

    function displayCart() {
        let cartIds = JSON.parse(localStorage.getItem('dkart_cart') || '[]');
        let cartData = allProducts.filter(p => cartIds.includes(p.id));
        render(cartData, 'cartList');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        render(allProducts.filter(p => p.name.toLowerCase().includes(val)), 'productList');
    });

    fetchItems();
</script>
</body>
</html>
