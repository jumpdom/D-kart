<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dkart | Shop Online</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-top">
            <div class="logo">Dkart</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search products...">
                <button onclick="searchFunction()">🔍</button>
            </div>
            <div class="nav-links">
                <div class="cart-btn">🛒 <span id="cart-count">0</span></div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="product-grid">
            <div class="product-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_6uP77_k8W1z0vj_k67eBvA0u6p7B6X3x9A&s" alt="Shirt">
                <div class="p-info">
                    <h4>Premium Cotton Shirt</h4>
                    <p class="p-price">₹599</p>
                    <div class="p-btns">
                        <button class="btn-cart" onclick="addToCart()">Add to Cart</button>
                        <button class="btn-buy" onclick="buyNow('Premium Cotton Shirt', '599')">Buy Now</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3>Order Details</h3>
            <input type="text" id="custName" placeholder="Aapka Naam">
            <input type="number" id="custPhone" placeholder="Mobile Number">
            <textarea id="custAddress" placeholder="Pura Address"></textarea>
            <div id="orderSummary" style="margin: 10px 0; color: #2874f0; font-weight: bold;"></div>
            <button class="confirm-btn" onclick="sendToWhatsApp()">Confirm Order</button>
            <button class="close-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
